<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр видео VK</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .video-link {
            display: inline-block;
            padding: 12px 24px;
            background-color: #0077FF;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;
        }
        .video-link:hover {
            background-color: #005bd1;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            position: relative;
            width: 90%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        .modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <button class="video-link" id="openVideo">Смотреть видео</button>

    <div class="modal-overlay" id="videoModal">
        <div class="modal-content">
            <button class="modal-close" id="closeVideo">✕</button>
            <iframe id="videoIframe" 
                    src="" 
                    allow="autoplay; encrypted-media; fullscreen; picture-in-picture; screen-wake-lock;" 
                    allowfullscreen>
            </iframe>
        </div>
    </div>

    <script>
        // Ваш URL преобразован в формат для встраивания
        // Из https://m.vkvideo.ru/video-239728300_456239063
        // Получаем oid=-239728300 и id=456239063
        var videoEmbedUrl = 'https://vk.com/video_ext.php?oid=-239728300&id=456239063&autoplay=1&hd=2';

        var modal = document.getElementById('videoModal');
        var iframe = document.getElementById('videoIframe');
        var openBtn = document.getElementById('openVideo');
        var closeBtn = document.getElementById('closeVideo');

        openBtn.addEventListener('click', function() {
            // Устанавливаем URL и открываем модальное окно
            iframe.src = videoEmbedUrl;
            modal.classList.add('active');
            // Автовоспроизведение может быть заблокировано браузером,
            // так как клик был по кнопке вне iframe. Но при открытии
            // модального окна пользователь уже совершил действие,
            // поэтому воспроизведение часто разрешается.
        });

        closeBtn.addEventListener('click', function() {
            modal.classList.remove('active');
            iframe.src = ''; // Останавливаем видео при закрытии
        });

        // Закрытие по клику на фон
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                modal.classList.remove('active');
                iframe.src = '';
            }
        });
    </script>

</body>
</html>
