<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
    <meta name="theme-color" content="#0a0a0c">
    <title>Screp Master</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            overscroll-behavior: none;
            position: fixed;
            inset: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* === ЭКРАН ЗАГРУЗКИ — новый фон + лого === */
        .loader-screen {
            position: fixed;
            inset: 0;
            background-image: url('https://github.com/zadano/zadano.github.io/blob/main/bk.png?raw=true');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            z-index: 100;
            transition: opacity 0.6s ease, visibility 0.6s ease;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .loader-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-logo {
            width: 187px;
            height: auto;
            position: relative;
            z-index: 1;
            top: 9px;
            filter: drop-shadow(0 8px 32px rgba(0,0,0,0.6));
        }

        /* === СТАРТОВЫЙ ЭКРАН — уверенные градиентные эллипсы === */
        .screen {
            position: absolute;
            inset: 0;
            background: var(--tg-theme-bg-color, #0a0a0c);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding-top: calc(max(24px, env(safe-area-inset-top)) + var(--tg-safe-top, 0px));
            padding-bottom: calc(max(30px, env(safe-area-inset-bottom)) + var(--tg-safe-bottom, 0px));
            padding-left: max(24px, env(safe-area-inset-left));
            padding-right: max(24px, env(safe-area-inset-right));
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
            transform: translateX(30px) scale(0.98);
            z-index: 1;
            height: 100%;
            overflow: hidden;
        }

        .screen::before,
        .screen::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .screen::before {
            width: 520px;
            height: 520px;
            top: -200px;
            left: -180px;
            background: radial-gradient(
                circle at center,
                rgba(0,111,255,0.55) 0%,
                rgba(0,111,255,0.28) 30%,
                rgba(0,111,255,0.08) 55%,
                transparent 72%
            );
            filter: blur(40px);
        }

        .screen::after {
            width: 480px;
            height: 480px;
            bottom: -180px;
            right: -160px;
            background: radial-gradient(
                circle at center,
                rgba(0,111,255,0.42) 0%,
                rgba(0,111,255,0.2) 30%,
                rgba(0,111,255,0.06) 55%,
                transparent 72%
            );
            filter: blur(40px);
        }

        .screen.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(0) scale(1);
        }

        /* Верхняя строка */
        .top-bar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            z-index: 1;
            animation: fadeDown 0.6s ease 0.1s both;
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 92px;
            height: auto;
        }

        /* Центр */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            flex: 1;
            justify-content: center;
            width: 100%;
            position: relative;
            z-index: 1;
            min-height: 0;
        }

        /* Профиль */
        .profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            animation: fadeUp 0.6s ease 0.2s both;
        }

        .avatar-wrap {
            position: relative;
        }

        .avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: linear-gradient(135deg, #006FFF, #4DA6FF);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: 700;
            color: #fff;
            overflow: hidden;
            box-shadow: 0 0 0 3px rgba(0,111,255,0.2), 0 12px 36px rgba(0,111,255,0.35);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge {
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #006FFF, #3A9BFF);
            color: #fff;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 3px 9px;
            border-radius: 99px;
            box-shadow: 0 4px 12px rgba(0,111,255,0.4);
            border: 2px solid var(--tg-theme-bg-color, #0a0a0c);
            white-space: nowrap;
        }

        .username {
            font-size: 22px;
            font-weight: 800;
            color: var(--tg-theme-text-color, #fff);
            letter-spacing: -0.4px;
            margin-top: 6px;
        }

        /* Заголовок */
        .headline {
            text-align: center;
            animation: fadeUp 0.6s ease 0.3s both;
        }

        .headline h1 {
            font-size: 28px;
            font-weight: 800;
            line-height: 1.2;
            color: var(--tg-theme-text-color, #fff);
            letter-spacing: -0.6px;
        }

        .headline h1 span {
            color: #006FFF;
        }

        /* Текст */
        .path-text {
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            color: var(--tg-theme-hint-color, rgba(255,255,255,0.55));
            max-width: 280px;
            font-weight: 500;
            animation: fadeUp 0.6s ease 0.4s both;
        }

        .path-text strong {
            color: #006FFF;
            font-weight: 700;
        }

        /* Низ */
        .bottom-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
            animation: fadeUp 0.6s ease 0.5s both;
            padding-top: 12px;
        }

        /* === ЧЕКБОКС СОГЛАСИЯ === */
        .consent-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 320px;
            margin-bottom: 18px;
            position: relative;
        }

        .consent-wrap {
            position: relative;
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .consent-wrap input {
            display: none;
        }

        .consent-wrap label {
            position: absolute;
            inset: 0;
            background-color: #006FFF;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.2s ease transform, 0.2s ease background-color, 0.2s ease box-shadow;
            overflow: hidden;
            z-index: 1;
        }

        .consent-wrap label::before {
            content: "";
            position: absolute;
            top: 50%;
            right: 0;
            left: 0;
            width: 15px;
            height: 14px;
            margin: 0 auto;
            background-color: #fff;
            transform: translateY(-50%);
            border-radius: 50%;
            box-shadow: inset 0 4px 6px #b8d4ff;
            transition: 0.2s ease width, 0.2s ease height;
        }

        .consent-wrap label:active {
            transform: scale(0.9);
        }

        .tick-mark {
            position: absolute;
            top: 0;
            right: 0;
            left: 0;
            width: 10px;
            height: 12px;
            margin: 0 auto;
            margin-left: 3px;
            transform: rotateZ(-40deg);
            pointer-events: none;
            z-index: 2;
        }

        .tick-mark::before,
        .tick-mark::after {
            content: "";
            position: absolute;
            background-color: #fff;
            border-radius: 2px;
            opacity: 0;
            transition: 0.2s ease transform, 0.2s ease opacity;
        }

        .tick-mark::before {
            left: 0;
            bottom: 0;
            width: 2px;
            height: 6px;
            box-shadow: -2px 0 5px rgba(0,0,0,0.23);
            transform: translateY(-44px);
        }

        .tick-mark::after {
            left: 0;
            bottom: 0;
            width: 100%;
            height: 2px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.23);
            transform: translateX(50px);
        }

        #consent-checkbox:checked + label {
            background-color: #07d410;
        }

        #consent-checkbox:checked + label::before {
            width: 0;
            height: 0;
        }

        #consent-checkbox:checked + label .tick-mark::before,
        #consent-checkbox:checked + label .tick-mark::after {
            transform: translate(0);
            opacity: 1;
        }

        .consent-text {
            font-size: 13px;
            line-height: 1.45;
            color: var(--tg-theme-hint-color, rgba(255,255,255,0.55));
            font-weight: 500;
        }

        .consent-text a {
            color: #006FFF;
            text-decoration: none;
            font-weight: 700;
            border-bottom: 1px solid rgba(0,111,255,0.4);
            transition: border-color 0.2s ease;
        }

        .consent-text a:active {
            border-color: #006FFF;
        }

        /* Кнопка */
        .btn {
            width: 100%;
            max-width: 320px;
            padding: 18px;
            background: linear-gradient(135deg, #006FFF, #3A9BFF);
            border: none;
            border-radius: 99px;
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.3s ease, filter 0.3s ease;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 28px rgba(0,111,255,0.4);
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            touch-action: manipulation;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, transparent 50%);
            border-radius: 99px;
            pointer-events: none;
        }

        .btn:active:not(:disabled) {
            transform: scale(0.96);
            box-shadow: 0 4px 16px rgba(0,111,255,0.3);
        }

        .btn .arrow-icon {
            font-size: 18px;
            transition: transform 0.2s ease;
        }

        .btn:active:not(:disabled) .arrow-icon {
            transform: translateX(3px);
        }

        .btn:disabled {
            opacity: 0.4;
            filter: grayscale(0.6);
            cursor: not-allowed;
            box-shadow: none;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Компактный режим */
        @media (max-height: 640px) {
            .hero { gap: 16px; }
            .avatar { width: 72px; height: 72px; font-size: 28px; }
            .username { font-size: 20px; }
            .headline h1 { font-size: 24px; }
            .path-text { font-size: 13px; }
            .btn { padding: 16px; font-size: 16px; }
            .logo { width: 80px; }
            .consent-row { margin-bottom: 14px; }
        }
    </style>
</head>
<body>

    <!-- ЗАГРУЗКА — новый фон + лого (без линии) -->
    <div class="loader-screen" id="loader">
        <img class="loader-logo" src="https://raw.githubusercontent.com/zadano/zadano.github.io/main/Content.svg" alt="Screp Master">
    </div>

    <!-- СТАРТОВЫЙ ЭКРАН — градиентные эллипсы -->
    <div class="screen" id="screen1">
        <div class="top-bar">
            <img class="logo" src="https://raw.githubusercontent.com/zadano/zadano.github.io/main/Content.svg" alt="Screp Master">
        </div>

        <div class="hero">
            <div class="profile">
                <div class="avatar-wrap">
                    <div class="avatar" id="avatar">?</div>
                    <div class="badge">Новичок</div>
                </div>
                <div class="username" id="username">Username</div>
            </div>

            <div class="headline">
                <h1>Скрепка → <span>Дом</span></h1>
            </div>

            <div class="path-text">
                Начни со скрепки и через <strong>трейды</strong> дойди до дома мечты
            </div>
        </div>

        <div class="bottom-section">
            <div class="consent-row">
                <div class="consent-wrap">
                    <input type="checkbox" id="consent-checkbox">
                    <label for="consent-checkbox">
                        <div class="tick-mark"></div>
                    </label>
                </div>
                <div class="consent-text">
                    Я принимаю <a href="https://zadano.github.io/mysite/legal.html" target="_blank" rel="noopener">правила и условия</a>
                </div>
            </div>

            <button class="btn" id="startBtn" onclick="startJourney()" disabled>
                Начать
                <span class="arrow-icon">→</span>
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        let tgUser = null;

        function applyTheme() {
            if (!tg) return;
            const p = tg.themeParams || {};
            const root = document.documentElement;
            if (p.bg_color) root.style.setProperty('--tg-theme-bg-color', p.bg_color);
            if (p.text_color) root.style.setProperty('--tg-theme-text-color', p.text_color);
            if (p.hint_color) root.style.setProperty('--tg-theme-hint-color', p.hint_color);
            document.body.style.backgroundColor = p.bg_color || '#0a0a0c';
            if (tg.setHeaderColor) {
                try { tg.setHeaderColor(p.bg_color || '#0a0a0c'); } catch (e) {}
            }
            if (tg.setBackgroundColor) {
                try { tg.setBackgroundColor(p.bg_color || '#0a0a0c'); } catch (e) {}
            }
        }

        function applyViewport() {
            if (!tg) return;
            const safeTop = tg.contentSafeAreaInset?.top ?? 0;
            const safeBottom = tg.contentSafeAreaInset?.bottom ?? 0;
            document.documentElement.style.setProperty('--tg-safe-top', safeTop + 'px');
            document.documentElement.style.setProperty('--tg-safe-bottom', safeBottom + 'px');
        }

        if (tg) {
            tg.ready();
            tg.expand();
            if (tg.disableVerticalSwipes) {
                try { tg.disableVerticalSwipes(); } catch (e) {}
            }
            if (tg.enableClosingConfirmation) {
                try { tg.enableClosingConfirmation(); } catch (e) {}
            }
            applyTheme();
            applyViewport();
            tg.onEvent('themeChanged', applyTheme);
            tg.onEvent('viewportChanged', applyViewport);
            if (tg.initDataUnsafe?.user) {
                tgUser = tg.initDataUnsafe.user;
            }
        }

        if (!tgUser) {
            tgUser = { first_name: "Username", photo_url: null };
        }

        document.getElementById("username").textContent = tgUser.first_name || "Игрок";
        const avatarEl = document.getElementById("avatar");
        if (tgUser.photo_url) {
            avatarEl.innerHTML = `<img src="${tgUser.photo_url}" alt="">`;
        } else {
            avatarEl.textContent = (tgUser.first_name || "?").charAt(0).toUpperCase();
        }

        /* === Логика согласия === */
        const consentCheckbox = document.getElementById("consent-checkbox");
        const startBtn = document.getElementById("startBtn");

        function syncConsentState() {
            if (consentCheckbox.checked) {
                startBtn.disabled = false;
            } else {
                startBtn.disabled = true;
            }
        }

        consentCheckbox.addEventListener("change", () => {
            syncConsentState();
            if (tg?.HapticFeedback) {
                tg.HapticFeedback.selectionChanged();
            }
        });

        syncConsentState();

        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('screen1').classList.add('active');
            }, 2000);
        });

        function startJourney() {
            if (!consentCheckbox.checked) {
                return;
            }
            if (tg) {
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('medium');
                }
                try {
                    tg.sendData(JSON.stringify({ action: "start", consent: true }));
                } catch (e) {}
                tg.close();
            } else {
                alert("Игра началась! (демо)");
            }
        }
    </script>
</body>
</html>
