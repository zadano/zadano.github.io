<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Zadano | ГДЗ 7 класс</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
<style>
:root{--accent:#FFD400;--accent-dark:#000;--accent-soft:#FFF9DB;--bg:#f7f7fb;--card:#fff;--text:#0f0f14;--muted:#6b7280;--border:#e5e7eb;--radius:16px;--radius-sm:12px;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 12px rgba(15,15,20,.04);--shadow-hover:0 4px 8px rgba(0,0,0,.05),0 12px 24px rgba(255,212,0,.35)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.header{display:flex;align-items:center;gap:.8rem;padding:.9rem 1.5rem;position:sticky;top:0;background:rgba(247,247,251,.85);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);z-index:100;border-bottom:1px solid var(--border)}
.hamburger{width:42px;height:42px;border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;cursor:pointer;background:var(--card);border:1px solid var(--border);transition:all .2s ease;flex-shrink:0}
.hamburger:hover{background:var(--accent-soft);border-color:var(--accent)}
.hamburger:active{transform:scale(.94)}
.hamburger span{display:block;height:2px;width:18px;background:var(--text);border-radius:2px}
.logo{font-size:1.35rem;font-weight:800;letter-spacing:-.04em;color:var(--text);flex-shrink:0;display:flex;align-items:center;text-decoration:none}
.logo::after{content:'.';color:var(--accent);font-size:1.6rem;line-height:1;margin-left:1px}
.search-wrap{flex:1;max-width:380px;margin-left:auto;position:relative}
.search-input{width:100%;padding:.7rem 2.6rem .7rem 2.6rem;border-radius:12px;border:1px solid var(--border);background:var(--card);font-family:'Inter',sans-serif;font-size:.92rem;color:var(--text);outline:none;transition:all .2s ease}
.search-input::placeholder{color:#9ca3af}
.search-input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px rgba(255,212,0,.25)}
.search-icon{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#9ca3af;fill:none;stroke-width:2;pointer-events:none}
.search-clear{position:absolute;right:.6rem;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:var(--bg);border:none;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:.75rem;color:var(--muted)}
.search-clear.visible{display:flex}
.search-results{display:none;position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.12);max-height:60vh;overflow-y:auto;z-index:200}
.search-results.visible{display:block}
.search-result{padding:.8rem 1rem;border-bottom:1px solid var(--border);cursor:pointer;font-size:.88rem}
.search-result:last-child{border-bottom:none}
.search-result:hover{background:var(--accent-soft)}
.search-result .sr-type{font-size:.7rem;text-transform:uppercase;color:var(--muted);font-weight:700;letter-spacing:.06em;margin-bottom:.15rem}
.search-result .sr-title{font-weight:600;color:var(--text)}
.search-result .sr-sub{font-size:.8rem;color:var(--muted);margin-top:.1rem}
.search-no{display:none;padding:1.5rem 1rem;text-align:center;color:var(--muted);font-size:.9rem}
.search-no.visible{display:block}
.full-menu{position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:1000;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;opacity:0;visibility:hidden;transition:opacity .3s cubic-bezier(.2,.9,.4,1.1),visibility 0s linear .3s;padding:4rem 2rem 2rem 8%;overflow-y:auto}
.full-menu.active{opacity:1;visibility:visible;transition:opacity .35s ease,visibility 0s linear 0s}
.menu-nav{display:flex;flex-direction:column;align-items:flex-start;gap:1.1rem;width:100%;max-width:700px}
.menu-link{font-family:'Inter',sans-serif;font-size:1.9rem;font-weight:550;text-decoration:none;color:#000;padding:.1rem 0;transition:opacity .2s;text-align:left;letter-spacing:-.02em;line-height:1.15;cursor:pointer;background:none;border:none}
.menu-link:hover{opacity:.55}
.close-menu{position:fixed;top:2rem;right:2rem;background:transparent;border:none;font-family:'Inter',sans-serif;font-size:1rem;font-weight:450;color:#000;cursor:pointer;padding:.5rem 1rem;display:flex;align-items:center;gap:6px;z-index:1001}
.close-menu:hover{opacity:.55}
body.no-scroll{overflow:hidden}
.container{max-width:760px;margin:0 auto;padding:1.5rem 1.5rem 4rem;width:100%;flex:1}
.section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.75rem;font-weight:700;margin-top:2rem;display:flex;align-items:center;gap:.5rem}
.section-title:first-child{margin-top:0}
.section-title::before{content:'';width:4px;height:14px;background:var(--accent);border-radius:2px}
.table-wrap{background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:1rem}
.schedule-table{width:100%;border-collapse:collapse;font-size:.9rem}
.schedule-table th,.schedule-table td{padding:.75rem 1rem;text-align:left}
.schedule-table th{background:var(--accent);color:#000;font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.schedule-table tbody tr{border-top:1px solid var(--border)}
.schedule-table td:first-child{font-weight:700;color:var(--accent-dark);width:130px;white-space:nowrap}
.schedule-table td:nth-child(2){font-weight:600}
.schedule-table td:nth-child(3){color:var(--muted);font-weight:500;width:80px}
.subject-list{display:flex;flex-direction:column;gap:.6rem;margin-bottom:1rem}
.subject-item{padding:1rem 1.2rem;background:var(--card);border-radius:var(--radius-sm);border:1px solid var(--border);font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s ease;display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--text);box-shadow:var(--shadow)}
.subject-item:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow-hover)}
.subject-item.hidden{display:none}
.subject-item .arrow{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:600;transition:all .2s ease;flex-shrink:0}
.subject-item:hover .arrow{background:var(--accent);color:#000;transform:translateX(4px)}
.subject-item .count{font-size:.75rem;color:var(--muted);font-weight:600;background:var(--bg);padding:.15rem .5rem;border-radius:20px;margin-right:.5rem}
mark{background:var(--accent);color:#000;padding:0 2px;border-radius:3px;font-weight:inherit}
.empty-state{display:none;padding:2.5rem 1rem;text-align:center;color:var(--muted);font-size:.95rem;background:var(--card);border-radius:var(--radius);border:1px dashed var(--border)}
.empty-state.visible{display:block}
.empty-state .icon{font-size:2rem;display:block;margin-bottom:.5rem;opacity:.4}
.extra-links{display:flex;flex-direction:column;gap:.6rem;margin-bottom:1rem}
.extra-link{padding:.9rem 1.2rem;background:var(--card);border-radius:var(--radius-sm);border:1px solid var(--border);font-size:.9rem;font-weight:500;text-decoration:none;color:var(--text);display:flex;justify-content:space-between;align-items:center;transition:all .2s ease;cursor:pointer;box-shadow:var(--shadow)}
.extra-link:hover{border-color:var(--accent);background:#fffdf0}
.extra-link .badge{font-size:.7rem;color:#000;background:var(--accent);padding:.25rem .6rem;border-radius:20px;font-weight:700}
.footer{text-align:center;padding:2rem 1.5rem;font-size:.8rem;color:var(--muted);border-top:1px solid var(--border);background:var(--card);margin-top:auto}
.footer a{color:var(--muted);text-decoration:none;margin:0 .5rem}
.footer a:hover{color:var(--accent-dark)}
.page{display:none}
.page.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.back-btn{display:inline-flex;align-items:center;gap:6px;margin-bottom:1.5rem;font-size:.85rem;text-decoration:none;color:var(--muted);font-weight:600;cursor:pointer;padding:.5rem .9rem;border-radius:10px;background:var(--card);border:1px solid var(--border);transition:all .2s;font-family:inherit}
.back-btn:hover{color:#000;border-color:var(--accent);background:var(--accent-soft)}
.page-title{font-size:2rem;font-weight:800;letter-spacing:-.03em;margin-bottom:.3rem}
.page-subtitle{font-size:.9rem;color:var(--muted);margin-bottom:1.5rem}
.date-list{display:flex;flex-direction:column;gap:.6rem;margin-bottom:1rem}
.date-item{padding:1rem 1.2rem;background:var(--card);border-radius:var(--radius-sm);border:1px solid var(--border);font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s ease;display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--text);box-shadow:var(--shadow)}
.date-item:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow-hover)}
.date-item .count{font-size:.75rem;color:var(--muted);font-weight:600;background:var(--bg);padding:.15rem .5rem;border-radius:20px}
.solution-block{margin-bottom:1.5rem}
.solution-block .task-title{font-weight:700;font-size:1rem;margin-bottom:.6rem;color:#000;display:flex;align-items:center;gap:.5rem}
.solution-block .task-title::before{content:'№';color:var(--accent-dark);font-weight:800}
.solution-block .task-desc{font-size:.95rem;color:#374151;line-height:1.8}
.solution-block .task-desc p{margin-bottom:.5rem}
.error-report{margin-top:2.5rem;font-size:.8rem;color:var(--muted);padding-top:1.5rem;border-top:1px dashed var(--border)}
.error-report a{color:var(--accent-dark);text-decoration:none;font-weight:600;cursor:pointer}
.error-report a:hover{text-decoration:underline}
.loader{display:flex;justify-content:center;padding:3rem 1rem;color:var(--muted);font-size:.9rem}
.loader::after{content:'';display:inline-block;width:16px;height:16px;margin-left:.5rem;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.article-body{font-size:.95rem;line-height:1.75;color:#374151}
.article-body h2{font-size:1.3rem;margin:1.5rem 0 .6rem;color:#000;font-weight:700}
.article-body h3{font-size:1.1rem;margin:1.2rem 0 .5rem;color:#000;font-weight:600}
.article-body p{margin-bottom:.8rem}
.article-body ul,.article-body ol{margin:.5rem 0 .8rem 1.4rem}
.article-body li{margin-bottom:.3rem}
.article-body code{background:var(--bg);padding:.1rem .35rem;border-radius:4px;font-size:.85em}
.article-body pre{background:#0f0f14;color:#fff;padding:1rem;border-radius:10px;overflow-x:auto;margin:.8rem 0;font-size:.85rem}
.article-body pre code{background:none;color:inherit;padding:0}
.article-body blockquote{border-left:3px solid var(--accent);padding-left:1rem;color:var(--muted);margin:.8rem 0}
.article-body img{max-width:100%;border-radius:10px;margin:.5rem 0}
@media(max-width:800px){.menu-link{font-size:1.6rem}.menu-nav{gap:.9rem}}
@media(max-width:700px){.search-wrap{max-width:200px}}
@media(max-width:550px){.header{padding:.7rem 1rem;gap:.5rem}.logo{font-size:1.15rem}.hamburger{width:38px;height:38px}.search-input{font-size:.85rem;padding:.6rem 2.2rem}.menu-link{font-size:1.35rem}.full-menu{padding:3.5rem 1.5rem 2rem 7%}.schedule-table{font-size:.82rem}.schedule-table th,.schedule-table td{padding:.55rem .7rem}.schedule-table td:first-child{width:105px}.page-title{font-size:1.6rem}.container{padding:1.25rem 1rem 3rem}.close-menu{top:1.2rem;right:1.2rem;font-size:.85rem}}
</style>
</head>
<body>

<header class="header">
  <div class="hamburger" id="openMenuBtn" aria-label="Открыть меню"><span></span><span></span><span></span></div>
  <a class="logo" href="#page/home">Zadano</a>
  <div class="search-wrap">
    <input type="text" class="search-input" id="searchInput" placeholder="Поиск по заданиям и статьям..." autocomplete="off">
    <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
    <button class="search-clear" id="searchClear" aria-label="Очистить">✕</button>
    <div class="search-results" id="searchResults"></div>
  </div>
</header>

<div class="full-menu" id="fullMenu" role="dialog" aria-modal="true">
  <button class="close-menu" id="closeMenuBtn"><span>✕</span> закрыть</button>
  <nav class="menu-nav" id="menuNav"></nav>
</div>

<div class="container" id="mainContainer">
  <div class="loader" id="globalLoader">Загрузка данных</div>
</div>

<footer class="footer">
  <div>
    <a href="#page/home">Главная</a>
    <a href="#page/about">О сайте</a>
  </div>
  <div style="margin-top:.6rem">Zadano © 2026 · для 7 класса</div>
</footer>

<script>
(function(){
  "use strict";

  const REPO = "zadano/zadano.github.io";
  const BRANCH = "main";
  const API = "https://api.github.com/repos/" + REPO + "/contents/";
  const RAW = "https://raw.githubusercontent.com/" + REPO + "/" + BRANCH + "/";
  const CACHE_KEY = "zadano_data_v2";
  const CACHE_TTL = 60 * 60 * 1000;

  const SUBJECTS = [
    "Литература","Алгебра","Геометрия","Вероятность и статистика",
    "Информатика","История","Обществознание","География","Биология",
    "Физика","Химия","Иностранный язык","Основы безопасности жизнедеятельности",
    "Физическая культура","Искусство","Технология"
  ];
  const SUBJECT_SLUGS = {
    "Литература":"literature",
    "Алгебра":"algebra",
    "Геометрия":"geometry",
    "Вероятность и статистика":"probability",
    "Информатика":"cs",
    "История":"history",
    "Обществознание":"social",
    "География":"geography",
    "Биология":"biology",
    "Физика":"physics",
    "Химия":"chemistry",
    "Иностранный язык":"foreign",
    "Основы безопасности жизнедеятельности":"obzh",
    "Физическая культура":"pe",
    "Искусство":"art",
    "Технология":"tech"
  };

  const container = document.getElementById("mainContainer");
  const menuNav = document.getElementById("menuNav");
  const searchInput = document.getElementById("searchInput");
  const searchClear = document.getElementById("searchClear");
  const searchResults = document.getElementById("searchResults");
  const menu = document.getElementById("fullMenu");

  let DATA = { gdz: [], articles: [], schedule: [] };

  /* ═══ ПАРСИНГ FRONTMATTER ═══ */
  function parseFrontmatter(text){
    const m = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/);
    if(!m) return {meta:{}, body:text};
    const raw = m[1];
    const meta = {};
    const lines = raw.split("\n");
    let i = 0;
    while(i < lines.length){
      const line = lines[i];
      if(!line.trim() || line.startsWith("  ")) { i++; continue; }
      const idx = line.indexOf(":");
      if(idx === -1){ i++; continue; }
      const key = line.slice(0,idx).trim();
      let val = line.slice(idx+1).trim();

      if(val === ""){
        // возможно, это список
        const items = [];
        i++;
        while(i < lines.length && lines[i].startsWith("  -")){
          const itemRaw = lines[i].trim().slice(1).trim();
          const itemIdx = itemRaw.indexOf(":");
          if(itemIdx > -1){
            const objKey = itemRaw.slice(0,itemIdx).trim();
            let objVal = itemRaw.slice(itemIdx+1).trim();
            objVal = unquote(objVal);
            // читаем вложенные поля
            const obj = {[objKey]: objVal};
            i++;
            while(i < lines.length && lines[i].startsWith("    ") && !lines[i].startsWith("  -")){
              const subRaw = lines[i].trim();
              const subIdx = subRaw.indexOf(":");
              if(subIdx > -1){
                const sk = subRaw.slice(0,subIdx).trim();
                let sv = subRaw.slice(subIdx+1).trim();
                obj[sk] = unquote(sv);
              }
              i++;
            }
            items.push(obj);
          } else {
            items.push(unquote(itemRaw));
            i++;
          }
        }
        meta[key] = items;
        continue;
      }
      meta[key] = unquote(val);
      i++;
    }
    return {meta, body:m[2]};
  }

  function unquote(v){
    v = String(v).trim();
    if((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) v = v.slice(1,-1);
    if(v === "true") return true;
    if(v === "false") return false;
    return v;
  }

  function mdToHtml(md){
    if(!md) return "";
    let html = md
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/^### (.+)$/gm,"<h3>$1</h3>")
      .replace(/^## (.+)$/gm,"<h2>$1</h2>")
      .replace(/^# (.+)$/gm,"<h2>$1</h2>")
      .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
      .replace(/\*(.+?)\*/g,"<em>$1</em>")
      .replace(/`([^`]+)`/g,"<code>$1</code>")
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    html = html.replace(/\n\n/g,"</p><p>").replace(/\n/g,"<br>");
    return "<p>" + html + "</p>";
  }

  function fmtDate(iso){
    if(!iso) return "";
    const [y,m,d] = iso.split("-");
    return d + "." + m + "." + y;
  }

  /* ═══ ЗАГРУЗКА ═══ */
  async function fetchDir(path){
    const r = await fetch(API + path + "?ref=" + BRANCH);
    if(!r.ok) return [];
    const items = await r.json();
    return items.filter(i=>i.type === "file" && i.name.endsWith(".md"));
  }

  async function fetchFile(path){
    const r = await fetch(RAW + path);
    if(!r.ok) return null;
    return await r.text();
  }

  async function loadAll(){
    const [gdzFiles, artFiles, schFiles] = await Promise.all([
      fetchDir("gdz"), fetchDir("articles"), fetchDir("schedule")
    ]);

    const gdz = [];
    for(const f of gdzFiles){
      const txt = await fetchFile("gdz/" + f.name);
      if(!txt) continue;
      const {meta, body} = parseFrontmatter(txt);
      gdz.push({
        file: f.name,
        class: meta.class || "7",
        subject: meta.subject || "—",
        date: meta.date || "",
        task: meta.task || "",
        body: body.trim()
      });
    }

    const articles = [];
    for(const f of artFiles){
      const txt = await fetchFile("articles/" + f.name);
      if(!txt) continue;
      const {meta, body} = parseFrontmatter(txt);
      const slug = (meta.slug || f.name.replace(/\.md$/,"")).toString().trim();
      articles.push({
        file: f.name,
        title: meta.title || slug,
        hidden: meta.hidden === true,
        slug: slug,
        body: body.trim()
      });
    }

    const schedule = [];
    for(const f of schFiles){
      const txt = await fetchFile("schedule/" + f.name);
      if(!txt) continue;
      const {meta} = parseFrontmatter(txt);
      schedule.push({
        file: f.name,
        date: meta.date || "",
        day: meta.day || "",
        lessons: Array.isArray(meta.lessons) ? meta.lessons : []
      });
    }

    DATA = { gdz, articles, schedule, loaded: Date.now() };
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(DATA)); }catch(e){}
    return DATA;
  }

  async function getData(){
    try{
      const cached = localStorage.getItem(CACHE_KEY);
      if(cached){
        const parsed = JSON.parse(cached);
        if(parsed.loaded && Date.now() - parsed.loaded < CACHE_TTL){
          DATA = parsed;
          return DATA;
        }
      }
    }catch(e){}
    return await loadAll();
  }

  /* ═══ УТИЛЫ ═══ */
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, c=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }
  function subjectSlug(name){ return SUBJECT_SLUGS[name] || name.toLowerCase().replace(/\s+/g,"-"); }
  function gdzBySubject(subj){ return DATA.gdz.filter(g=>g.subject === subj); }
  function gdzBySubjectDate(subj, date){ return DATA.gdz.filter(g=>g.subject === subj && g.date === date); }
  function datesForSubject(subj){
    const set = new Set();
    gdzBySubject(subj).forEach(g=>{ if(g.date) set.add(g.date); });
    return [...set].sort((a,b)=>b.localeCompare(a));
  }

  function getTodaySchedule(){
    const today = new Date();
    const iso = today.getFullYear() + "-" +
      String(today.getMonth()+1).padStart(2,"0") + "-" +
      String(today.getDate()).padStart(2,"0");
    let entry = DATA.schedule.find(s=>s.date === iso);
    if(!entry){
      // берём ближайшее будущее, иначе самое свежее
      const sorted = [...DATA.schedule].sort((a,b)=>a.date.localeCompare(b.date));
      entry = sorted.find(s=>s.date >= iso) || sorted[sorted.length - 1];
    }
    return entry;
  }

  /* ═══ РОУТИНГ ═══ */
  function navigate(hash){
    if(!hash) hash = "page/home";
    if(location.hash !== "#" + hash) location.hash = hash;
    else render(hash);
  }
  window.addEventListener("hashchange", ()=>render(location.hash.slice(1) || "page/home"));

  function render(route){
    closeMenu();
    if(route === "page/home") return renderHome();
    if(route === "page/about") return renderAbout();
    if(route === "page/errors") return renderErrors();
    if(route.startsWith("page/subject/")) return renderSubject(route.slice("page/subject/".length));
    if(route.startsWith("page/gdz/")) return renderGdzPage(route.slice("page/gdz/".length));
    if(route.startsWith("article/")) return renderArticle(route.slice("article/".length));
    renderHome();
  }

  /* ═══ ГЛАВНАЯ ═══ */
  function renderHome(){
    // ── Расписание ──
    const sch = getTodaySchedule();
    let scheduleHtml = "";
    if(sch && sch.lessons && sch.lessons.length){
      const header = 'Расписание на ' + fmtDate(sch.date) + (sch.day ? " · " + esc(sch.day) : "");
      scheduleHtml =
        '<div class="section-title">' + header + '</div>' +
        '<div class="table-wrap"><table class="schedule-table">' +
        '<thead><tr><th>Время</th><th>Урок</th><th>Каб.</th></tr></thead><tbody>' +
        sch.lessons.map(l=>
          '<tr><td>' + esc(l.time||"") + '</td><td>' + esc(l.subject||"") + '</td><td>' + esc(l.room||"") + '</td></tr>'
        ).join("") +
        '</tbody></table></div>';
    } else {
      scheduleHtml = '<div class="section-title">Расписание</div>' +
        '<div class="empty-state visible"><span class="icon">🗓️</span>Расписание пока не добавлено.</div>';
    }

    // ── Предметы ──
    const subjectsHtml = SUBJECTS.map(s=>{
      const count = gdzBySubject(s).length;
      return '<a class="subject-item" href="#page/subject/' + subjectSlug(s) + '">' +
        '<span>' + esc(s) + (count ? ' <span class="count">' + count + '</span>' : '') + '</span>' +
        '<span class="arrow">→</span></a>';
    }).join("");

    // ── Статьи ──
    const articlesHtml = DATA.articles.filter(a=>!a.hidden).map(a=>
      '<a class="subject-item" href="#article/' + esc(a.slug) + '">' +
      '<span>' + esc(a.title) + '</span><span class="arrow">→</span></a>'
    ).join("");

    container.innerHTML =
      '<section class="page active">' +
        scheduleHtml +
        '<div class="section-title">Список предметов</div>' +
        '<div class="subject-list">' + subjectsHtml + '</div>' +
        (articlesHtml ? '<div class="section-title">Статьи</div><div class="subject-list">' + articlesHtml + '</div>' : '') +
        '<div class="section-title">Полезное</div>' +
        '<div class="extra-links">' +
          '<div class="extra-link">Список дз <span class="badge">скоро</span></div>' +
          '<a href="#" class="extra-link">Telegram канал <span class="badge">скоро</span></a>' +
        '</div>' +
      '</section>';
  }

  /* ═══ ПРЕДМЕТ ═══ */
  function renderSubject(slug){
    const subj = SUBJECTS.find(s=>subjectSlug(s) === slug);
    if(!subj) return renderHome();

    const dates = datesForSubject(subj);
    let html = '<a class="back-btn" href="#page/home">← назад</a>' +
      '<h1 class="page-title">' + esc(subj) + '</h1>';

    if(!dates.length){
      html += '<div class="empty-state visible"><span class="icon">📭</span>Пока решений нет. Скоро появятся.</div>';
    } else {
      html += '<div class="date-list">';
      dates.forEach(d=>{
        const items = gdzBySubjectDate(subj, d);
        html += '<a class="date-item" href="#page/gdz/' + subjectSlug(subj) + '/' + d + '">' +
          '<span>' + esc(fmtDate(d)) + '</span>' +
          '<span class="count">' + items.length + '</span></a>';
      });
      html += '</div>';
    }
    container.innerHTML = '<section class="page active">' + html + '</section>';
  }

  /* ═══ ГДЗ ПО ДАТЕ ═══ */
  function renderGdzPage(rest){
    const parts = rest.split("/");
    const slug = parts[0];
    const date = parts[1];
    const subj = SUBJECTS.find(s=>subjectSlug(s) === slug);
    if(!subj) return renderHome();

    const items = gdzBySubjectDate(subj, date);
    const backHref = "#page/subject/" + slug;

    let html = '<a class="back-btn" href="' + backHref + '">← назад</a>' +
      '<h1 class="page-title">' + esc(fmtDate(date)) + '</h1>' +
      '<p class="page-subtitle">' + esc(subj) + '</p>';

    if(!items.length){
      html += '<div class="empty-state visible"><span class="icon">📭</span>Нет решений на эту дату.</div>';
    } else {
      items.forEach(item=>{
        const errTitle = encodeURIComponent("Ошибка: " + subj + ", №" + item.task + ", " + fmtDate(item.date));
        const pageUrl = location.origin + location.pathname + "#page/gdz/" + slug + "/" + date;
        const errBody = encodeURIComponent(
          "**Страница:** " + pageUrl + "\n" +
          "**Предмет:** " + subj + "\n" +
          "**Дата:** " + fmtDate(item.date) + "\n" +
          "**Задание:** №" + item.task + "\n\n" +
          "**Что не так:**\n(опишите ошибку)"
        );
        const issueUrl = "https://github.com/" + REPO + "/issues/new?title=" + errTitle + "&body=" + errBody;

        html += '<div class="solution-block">' +
          '<div class="task-title">' + esc(item.task) + '</div>' +
          '<div class="task-desc">' + mdToHtml(item.body) + '</div>' +
          '<div class="error-report">Нашли ошибку? <a href="' + issueUrl + '" target="_blank" rel="noopener">Сообщите об этом.</a></div>' +
        '</div>';
      });
    }
    container.innerHTML = '<section class="page active">' + html + '</section>';
  }

  /* ═══ СТАТЬЯ ═══ */
  function renderArticle(slug){
    const art = DATA.articles.find(a=>a.slug === slug);
    if(!art){
      container.innerHTML = '<section class="page active"><a class="back-btn" href="#page/home">← назад</a><h1 class="page-title">Статья не найдена</h1></section>';
      return;
    }
    container.innerHTML =
      '<section class="page active">' +
        '<a class="back-btn" href="#page/home">← назад</a>' +
        '<h1 class="page-title">' + esc(art.title) + '</h1>' +
        '<div class="article-body">' + mdToHtml(art.body) + '</div>' +
      '</section>';
  }

  /* ═══ О САЙТЕ ═══ */
  function renderAbout(){
    container.innerHTML =
      '<section class="page active">' +
        '<a class="back-btn" href="#page/home">← назад</a>' +
        '<h1 class="page-title">О сайте</h1>' +
        '<p class="page-subtitle">Коротко</p>' +
        '<div class="article-body"><p>Zadano — минималистичный ГДЗ-помощник для 7 класса. Выбирай предмет — смотри решения.</p></div>' +
      '</section>';
  }

  /* ═══ СООБЩЕНИЯ (приватная страница) ═══ */
  async function renderErrors(){
    container.innerHTML = '<section class="page active"><div class="loader">Загрузка сообщений</div></section>';
    try{
      const r = await fetch("https://api.github.com/repos/" + REPO + "/issues?state=all&per_page=30");
      if(!r.ok) throw new Error("API error");
      const issues = await r.json();
      let html = '<a class="back-btn" href="#page/home">← назад</a>' +
        '<h1 class="page-title">Сообщения об ошибках</h1>' +
        '<p class="page-subtitle">' + issues.length + ' шт.</p>';

      if(!issues.length){
        html += '<div class="empty-state visible"><span class="icon">✅</span>Пока сообщений нет.</div>';
      } else {
        html += '<div class="subject-list">';
        issues.forEach(iss=>{
          const state = iss.state === "open" ? "🟢" : "⚪";
          html += '<a class="subject-item" href="' + iss.html_url + '" target="_blank" rel="noopener">' +
            '<span>' + state + ' ' + esc(iss.title) + '</span>' +
            '<span class="count">#' + iss.number + '</span></a>';
        });
        html += '</div>';
      }
      container.innerHTML = '<section class="page active">' + html + '</section>';
    }catch(e){
      container.innerHTML = '<section class="page active"><a class="back-btn" href="#page/home">← назад</a><h1 class="page-title">Не удалось загрузить</h1></section>';
    }
  }

  /* ═══ МЕНЮ ═══ */
  function buildMenu(){
    const visibleArticles = DATA.articles.filter(a=>!a.hidden);
    let html = '<a class="menu-link" data-nav="page/home">главная</a>';
    SUBJECTS.forEach(s=>{
      html += '<a class="menu-link" data-nav="page/subject/' + subjectSlug(s) + '">' + esc(s.toLowerCase()) + '</a>';
    });
    visibleArticles.forEach(a=>{
      html += '<a class="menu-link" data-nav="article/' + esc(a.slug) + '">' + esc(a.title) + '</a>';
    });
    html += '<a class="menu-link" data-nav="page/about">о сайте</a>';
    menuNav.innerHTML = html;
    menuNav.querySelectorAll(".menu-link").forEach(el=>{
      el.addEventListener("click", e=>{
        e.preventDefault();
        navigate(el.dataset.nav);
      });
    });
  }

  function openMenu(){ menu.classList.add("active"); document.body.classList.add("no-scroll"); }
  function closeMenu(){ menu.classList.remove("active"); document.body.classList.remove("no-scroll"); }
  document.getElementById("openMenuBtn").addEventListener("click", openMenu);
  document.getElementById("closeMenuBtn").addEventListener("click", closeMenu);

  /* ═══ ПОИСК ═══ */
  function performSearch(q){
    q = q.trim().toLowerCase();
    searchClear.classList.toggle("visible", q.length > 0);
    if(!q){ searchResults.classList.remove("visible"); searchResults.innerHTML = ""; return; }

    const results = [];

    DATA.gdz.forEach(g=>{
      const hay = (g.subject + " " + g.task + " " + g.body).toLowerCase();
      if(hay.includes(q)){
        const slug = subjectSlug(g.subject);
        results.push({
          type:"ГДЗ", title:g.subject + " · №" + g.task,
          sub:fmtDate(g.date), href:"#page/gdz/" + slug + "/" + g.date
        });
      }
    });

    DATA.articles.forEach(a=>{
      const hay = (a.title + " " + a.body).toLowerCase();
      if(hay.includes(q)){
        results.push({
          type:"Статья", title:a.title, sub:a.hidden ? "скрытая" : "",
          href:"#article/" + a.slug
        });
      }
    });

    if(!results.length){
      searchResults.innerHTML = '<div class="search-no visible">Ничего не найдено</div>';
    } else {
      searchResults.innerHTML = results.slice(0,20).map(r=>
        '<div class="search-result" data-href="' + esc(r.href) + '">' +
          '<div class="sr-type">' + esc(r.type) + '</div>' +
          '<div class="sr-title">' + esc(r.title) + '</div>' +
          (r.sub ? '<div class="sr-sub">' + esc(r.sub) + '</div>' : '') +
        '</div>'
      ).join("");
    }
    searchResults.classList.add("visible");
    searchResults.querySelectorAll(".search-result").forEach(el=>{
      el.addEventListener("click", ()=>{
        searchResults.classList.remove("visible");
        searchInput.value = "";
        searchClear.classList.remove("visible");
        navigate(el.dataset.href.slice(1));
      });
    });
  }

  searchInput.addEventListener("input", e=>performSearch(e.target.value));
  searchClear.addEventListener("click", ()=>{ searchInput.value=""; performSearch(""); searchInput.focus(); });
  searchInput.addEventListener("keydown", e=>{ if(e.key === "Esc" || e.key === "Escape"){ searchInput.value=""; performSearch(""); searchInput.blur(); }});
  document.addEventListener("click", e=>{ if(!e.target.closest(".search-wrap")) searchResults.classList.remove("visible"); });

  /* ═══ СТАРТ ═══ */
  async function init(){
    await getData();
    buildMenu();
    render(location.hash.slice(1) || "page/home");
  }
  init();
})();
</script>
</body>
</html>
