<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Zadano | ГДЗ 7 класс</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232563EB'/><text x='46' y='72' font-size='64' font-family='Arial,sans-serif' font-weight='900' fill='white' text-anchor='middle'>Z</text><circle cx='78' cy='70' r='7' fill='%23F59E0B'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
<script src="/popup.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js" defer></script>
<script src="/ga.js" async></script>
<style>
:root{
  --bg:#F5F7FA;
  --sch-bg:#EEF3FA;
  --card:#FFFFFF;
  --card-soft:#F7F9FC;
  --border:#E1E8F0;
  --border-soft:#EDF1F6;
  --accent:#2563EB;
  --accent-soft:#DBE7FB;
  --accent-glow:rgba(37,99,235,.25);
  --warm:#F59E0B;
  --warm-soft:#FEF3C7;
  --ink:#0F1B3D;
  --ink-2:#2A3654;
  --muted:#6B7A94;
  --radius-lg:28px;
  --radius-md:20px;
  --radius-sm:14px;
  --ease:cubic-bezier(.2,.9,.4,1.1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;padding:1rem}
body.no-scroll{overflow:hidden}

.header{display:flex;align-items:center;gap:.8rem;padding:.6rem 1rem;max-width:1280px;margin:0 auto 1rem}
.hamburger{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--card);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:all .2s;flex-shrink:0}
.hamburger:hover{border-color:var(--accent);background:var(--accent-soft)}
.hamburger:active{transform:scale(.94)}
.hamburger span{display:block;width:18px;height:2px;background:var(--ink);border-radius:2px}
.logo{font-size:1.4rem;font-weight:900;letter-spacing:-.05em;color:var(--ink);text-decoration:none;display:flex;align-items:center}
.logo::after{content:'.';color:var(--accent);font-size:1.7rem;line-height:1;margin-left:1px}

.search{flex:1;max-width:420px;margin-left:auto;position:relative}
.search-input{width:100%;padding:.65rem 2.4rem .65rem 2.4rem;border-radius:40px;border:1px solid var(--border);background:var(--card);font-family:inherit;font-size:.88rem;color:var(--ink);outline:none;transition:all .2s;font-weight:500}
.search-input::placeholder{color:var(--muted);font-weight:400}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-glow)}
.search-icon{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2;pointer-events:none}
.search-input:focus + .search-icon{stroke:var(--accent)}
.search-clear{position:absolute;right:.6rem;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:var(--card-soft);border:none;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:.7rem;color:var(--muted)}
.search-clear.visible{display:flex}
.search-results{display:none;position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 30px rgba(15,27,61,.1);max-height:60vh;overflow-y:auto;z-index:200}
.search-results.visible{display:block}
.search-result{padding:.8rem 1rem;border-bottom:1px solid var(--border-soft);cursor:pointer;font-size:.88rem;transition:background .15s}
.search-result:last-child{border-bottom:none}
.search-result:hover{background:var(--accent-soft)}
.search-result .sr-type{font-size:.65rem;text-transform:uppercase;color:var(--accent);font-weight:700;letter-spacing:.08em;margin-bottom:.15rem}
.search-result .sr-title{font-weight:600;color:var(--ink)}
.search-result .sr-sub{font-size:.8rem;color:var(--muted);margin-top:.1rem}
.search-no{display:none;padding:1.5rem 1rem;text-align:center;color:var(--muted);font-size:.9rem}
.search-no.visible{display:block}

.full-menu{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:1000;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:4rem 2rem 2rem 8%;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s;overflow-y:auto}
.full-menu.active{opacity:1;visibility:visible;transition:opacity .35s ease,visibility 0s linear 0s}
.menu-nav{display:flex;flex-direction:column;align-items:flex-start;gap:.2rem;width:100%;max-width:800px}
.menu-link,
.menu-toggle{font-family:inherit;font-size:2.2rem;font-weight:600;text-decoration:none;color:var(--ink);letter-spacing:-.03em;line-height:1.15;cursor:pointer;background:none;border:none;text-align:left;padding:.35rem 0;transition:color .2s;display:flex;align-items:center;gap:.8rem;width:100%}
.menu-link:hover,
.menu-toggle:hover{color:var(--accent)}
.menu-toggle .chev{display:inline-block;width:20px;height:20px;transition:transform .3s var(--ease);color:var(--muted);flex-shrink:0}
.menu-toggle[aria-expanded="true"] .chev{transform:rotate(180deg);color:var(--accent)}
.menu-toggle[aria-expanded="true"]{color:var(--accent)}
.menu-toggle .label{flex:1}
.menu-sub{overflow:hidden;max-height:0;transition:max-height .35s var(--ease),opacity .25s ease;opacity:0;padding-left:2.6rem;width:100%}
.menu-sub.open{max-height:1600px;opacity:1;padding-top:.4rem;padding-bottom:.6rem}
.menu-sublink{display:block;font-family:inherit;font-size:1.15rem;font-weight:500;color:var(--muted);text-decoration:none;letter-spacing:-.01em;line-height:1.3;padding:.4rem 0;cursor:pointer;transition:color .2s,transform .2s;border:none;background:none;text-align:left;width:100%}
.menu-sublink:hover{color:var(--accent);transform:translateX(4px)}
.menu-sub-grid{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:.15rem 1.5rem}
.close-menu{position:fixed;top:1.6rem;right:1.6rem;background:transparent;border:none;font-family:inherit;font-size:1rem;font-weight:500;color:var(--ink);cursor:pointer;padding:.5rem 1rem;display:flex;align-items:center;gap:6px;transition:opacity .2s;z-index:1001}
.close-menu:hover{opacity:.55}

.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:1rem}

.banner{background:var(--sch-bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.6rem 1.8rem 1.4rem;display:flex;flex-direction:column;gap:1rem;position:relative;overflow:hidden}
.banner::before{content:'';position:absolute;top:-40%;right:-8%;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.08),transparent 70%);pointer-events:none}
.banner-inner{display:flex;gap:1.1rem;align-items:flex-start;position:relative;z-index:1}
.banner-icon{width:52px;height:52px;flex-shrink:0;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1.6rem;line-height:1}
.banner-body{flex:1;min-width:0}
.banner-title{font-size:1.2rem;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin-bottom:.35rem;line-height:1.25}
.banner-text{font-size:.92rem;color:var(--ink-2);line-height:1.55;max-height:4.5em;overflow:hidden;position:relative;transition:max-height .35s ease;padding-right:1.5rem}
.banner-slide.expanded .banner-text,
.banner.expanded .banner-text{max-height:2000px}
.banner-text::after{content:'';position:absolute;left:0;right:1.5rem;bottom:0;height:2em;background:linear-gradient(transparent, var(--sch-bg));pointer-events:none;opacity:1;transition:opacity .25s}
.banner-slide.expanded .banner-text::after,
.banner.expanded .banner-text::after{opacity:0}
.banner-toggle{display:inline-flex;align-items:center;gap:.35rem;margin-top:.5rem;background:none;border:none;color:var(--accent);font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer;padding:0}
.banner-toggle:hover{opacity:.75}
.banner-toggle::after{content:'▾';transition:transform .25s;margin-left:.15rem}
.banner-slide.expanded .banner-toggle::after,
.banner.expanded .banner-toggle::after{transform:rotate(180deg)}
.banner-actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.9rem}
.banner-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.65rem 1.2rem;border-radius:40px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;font-size:.85rem;border:none;cursor:pointer;transition:all .2s}
.banner-btn:hover{background:var(--ink);transform:translateY(-1px)}
.banner-btn::after{content:'→';font-weight:800}
.banner-close{position:absolute;top:.7rem;right:.7rem;width:32px;height:32px;border-radius:50%;background:transparent;border:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.9rem;z-index:2;transition:all .2s}
.banner-close:hover{background:var(--card);color:var(--ink)}
.banner-carousel{position:relative}
.banner-slide{display:none;position:relative}
.banner-slide.active{display:block;animation:fadeIn .3s ease}
.banner-nav{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-top:.9rem;padding-top:.8rem;border-top:1px solid var(--border);position:relative;z-index:1}
.banner-dots{display:flex;gap:.4rem;align-items:center}
.banner-dot{width:8px;height:8px;border-radius:50%;background:var(--border);border:none;padding:0;cursor:pointer;transition:all .2s}
.banner-dot.active{background:var(--accent);transform:scale(1.3)}
.banner-arrows{display:flex;gap:.4rem}
.banner-arrow{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--ink);cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.banner-arrow:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.banner-counter{font-size:.72rem;color:var(--muted);font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}

.schedule-bar{background:var(--sch-bg);color:var(--ink);border-radius:var(--radius-lg);padding:1.4rem 1.6rem 1.4rem;display:flex;flex-direction:column;gap:1rem;position:relative;overflow:hidden;border:1px solid var(--border)}
.schedule-bar::before{content:'';position:absolute;top:-50%;right:-10%;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.07),transparent 70%);pointer-events:none}
.schedule-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;position:relative;z-index:1;padding-bottom:.9rem;border-bottom:1px solid var(--border)}
.schedule-title{font-size:1rem;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:.6rem;color:var(--ink)}
.schedule-title .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--accent-soft)}50%{box-shadow:0 0 0 8px rgba(37,99,235,.08)}}
.schedule-title .day-name{color:var(--accent);font-weight:700;font-size:.85rem}
.schedule-tabs{display:flex;gap:.25rem;background:#fff;padding:.25rem;border-radius:30px;border:1px solid var(--border)}
.schedule-tab{font-family:inherit;font-size:.78rem;font-weight:700;padding:.45rem .9rem;border-radius:20px;border:none;background:none;color:var(--muted);cursor:pointer;transition:all .2s;white-space:nowrap}
.schedule-tab:hover{color:var(--accent)}
.schedule-tab.active{background:var(--accent);color:#fff}
.schedule-arrows{display:flex;gap:.35rem}
.schedule-arrow{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:#fff;color:var(--ink);font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.schedule-arrow:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.schedule-arrow:disabled{opacity:.35;cursor:not-allowed}
.schedule-arrow:disabled:hover{background:#fff;color:var(--ink);border-color:var(--border)}
.day-progress{display:flex;align-items:center;gap:.6rem;font-size:.72rem;color:var(--muted);font-weight:600;position:relative;z-index:1}
.day-progress-bar{flex:1;height:3px;background:var(--border);border-radius:3px;overflow:hidden}
.day-progress-fill{height:100%;background:var(--accent);transition:width .8s var(--ease)}
.lessons-strip{display:flex;gap:.6rem;overflow-x:auto;padding-bottom:.4rem;scroll-snap-type:x mandatory;scrollbar-width:none;position:relative;z-index:1}
.lessons-strip::-webkit-scrollbar{display:none}
.lesson-card{flex:0 0 auto;scroll-snap-align:start;background:#fff;border:1px solid var(--border);border-radius:16px;padding:.9rem 1.1rem;min-width:150px;display:flex;flex-direction:column;gap:.35rem;text-decoration:none;color:var(--ink);transition:all .22s var(--ease);position:relative;cursor:pointer}
.lesson-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 16px rgba(37,99,235,.12)}
.lesson-card .time{font-size:.72rem;font-weight:700;letter-spacing:.03em;color:var(--accent);font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.lesson-card .name{font-size:.95rem;font-weight:700;letter-spacing:-.01em;line-height:1.2;color:var(--ink)}
.lesson-card .room{font-size:.7rem;color:var(--muted);font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.lesson-card.has-gdz{background:#fff;border-color:var(--warm);border-width:1.5px}
.lesson-card.has-gdz::after{content:'';position:absolute;top:.75rem;right:.85rem;width:6px;height:6px;border-radius:50%;background:var(--warm)}
.lesson-card .gdz-hint{position:absolute;bottom:.65rem;right:.85rem;font-size:.6rem;font-weight:800;color:var(--warm);letter-spacing:.02em}
.lesson-card.current{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 18px rgba(37,99,235,.25)}
.lesson-card.current .time,.lesson-card.current .room{color:rgba(255,255,255,.75)}
.lesson-card.current .name{color:#fff}
.lesson-card.current .gdz-hint{color:#FEF3C7}
.lesson-card.current::before{content:'идёт';position:absolute;top:-8px;left:12px;background:var(--accent);color:#fff;font-size:.58rem;font-weight:800;letter-spacing:.08em;padding:.2rem .5rem;border-radius:20px;text-transform:uppercase}
.lesson-card.current.has-gdz{border-color:var(--accent);background:var(--accent)}
.lesson-card.current.has-gdz::after{background:#FEF3C7}
.lesson-empty{padding:1.2rem;border-radius:16px;background:#fff;font-size:.82rem;color:var(--muted);text-align:center;width:100%;border:1px solid var(--border)}

.bento{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:minmax(140px,auto);gap:1rem}
.tile{border-radius:var(--radius-lg);padding:1.6rem 1.8rem;position:relative;overflow:hidden;display:flex;flex-direction:column;transition:transform .3s var(--ease),box-shadow .3s;background:var(--card);border:1px solid var(--border)}
.tile.clickable{cursor:pointer}
.tile.clickable:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(15,27,61,.06)}
.tile.latest{grid-column:span 3;grid-row:span 2;padding:1.6rem 1.6rem}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.section-title{font-size:1rem;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.section-more{font-size:.72rem;color:var(--accent);text-decoration:none;font-weight:700;transition:opacity .2s;cursor:pointer;background:none;border:none;font-family:inherit}
.section-more:hover{opacity:.7}
.latest-list{display:flex;flex-direction:column;gap:.5rem;flex:1}
.latest-item{display:flex;align-items:center;gap:.7rem;padding:.65rem .8rem;background:var(--card-soft);border-radius:12px;text-decoration:none;color:var(--ink);transition:all .2s;border:1px solid var(--border-soft)}
.latest-item:hover{background:var(--accent-soft);border-color:var(--accent-soft);transform:translateX(3px)}
.latest-item .dot{width:8px;height:8px;border-radius:50%;background:var(--warm);flex-shrink:0}
.latest-item .info{flex:1;min-width:0}
.latest-item .name{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;color:var(--ink)}
.latest-item .meta{font-size:.68rem;color:var(--muted);font-weight:500;display:block;margin-top:.1rem}
.latest-item .task{font-size:.72rem;font-weight:800;color:#fff;background:var(--warm);padding:.2rem .5rem;border-radius:6px;flex-shrink:0}
.tile.subjects{grid-column:span 3;grid-row:span 2;padding:1.6rem 1.8rem}
.subjects-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.subjects-title{font-size:1.1rem;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.subjects-count{font-size:.72rem;color:var(--muted);font-weight:600}
.subjects-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;flex:1}
.subject-chip{display:flex;align-items:center;gap:.7rem;padding:.7rem 1rem;background:var(--card-soft);border-radius:12px;text-decoration:none;color:var(--ink);font-size:.88rem;font-weight:600;transition:all .2s var(--ease);border:1px solid var(--border-soft)}
.subject-chip:hover{background:var(--accent-soft);border-color:var(--accent);transform:translateX(3px)}
.subject-chip .icon{width:22px;height:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.subject-chip .icon svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.subject-chip .name{flex:1}
.subject-chip .n{font-size:.68rem;font-weight:800;color:var(--muted);background:#fff;padding:.2rem .5rem;border-radius:20px;min-width:24px;text-align:center;border:1px solid var(--border-soft)}
.subject-chip:hover .n{background:var(--accent);color:#fff;border-color:var(--accent)}
.tile.articles{grid-column:span 3;grid-row:span 2;padding:1.6rem 1.6rem}
.articles-list{display:flex;flex-direction:column;gap:.5rem;flex:1}
.article-item{display:flex;align-items:flex-start;gap:.6rem;padding:.75rem .85rem;background:var(--card-soft);border-radius:12px;text-decoration:none;color:var(--ink);transition:all .2s;border:1px solid var(--border-soft)}
.article-item:hover{background:var(--accent-soft);border-color:var(--accent);transform:translateX(3px)}
.article-item .info{flex:1;min-width:0}
.article-item .name{font-size:.85rem;font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--ink)}
.article-item .meta{font-size:.68rem;color:var(--muted);font-weight:500;margin-top:.2rem}
.article-item .arrow{color:var(--accent);font-weight:800;font-size:1rem;line-height:1}
.tile.feedback{grid-column:span 3;grid-row:span 1;padding:1.4rem 1.6rem;flex-direction:row;align-items:center;gap:1rem;min-height:110px}
.feedback-icon{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0;transition:transform .3s var(--ease)}
.tile.feedback:hover .feedback-icon{transform:rotate(-12deg) scale(1.05);background:var(--accent);color:#fff}
.feedback-text{flex:1}
.feedback-title{font-size:1.1rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.15rem;color:var(--ink)}
.feedback-sub{font-size:.82rem;color:var(--muted)}
.feedback-badge{background:var(--accent);color:#fff;font-size:.68rem;font-weight:800;padding:.3rem .7rem;border-radius:20px;letter-spacing:.04em;flex-shrink:0}
.tile.about{grid-column:span 3;grid-row:span 1;padding:1.4rem 1.6rem;flex-direction:row;align-items:center;gap:1rem;justify-content:space-between;min-height:110px}
.about-text{flex:1}
.about-title{font-size:1.1rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.15rem;color:var(--ink)}
.about-sub{font-size:.82rem;color:var(--muted);line-height:1.4}
.about-arrow{width:46px;height:46px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:800;flex-shrink:0;transition:transform .3s var(--ease)}
.tile.about:hover .about-arrow{transform:translateX(5px) rotate(-45deg);background:var(--accent)}

.page{display:none}
.page.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.inner{max-width:900px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2rem 2.2rem 2.4rem}
.back-btn{display:inline-flex;align-items:center;gap:6px;margin-bottom:1.5rem;font-size:.85rem;text-decoration:none;color:var(--muted);font-weight:600;cursor:pointer;padding:.5rem .9rem;border-radius:10px;background:var(--card-soft);border:1px solid var(--border);transition:all .2s;font-family:inherit}
.back-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.page-title{font-size:2rem;font-weight:800;letter-spacing:-.03em;margin-bottom:.3rem;color:var(--ink)}
.page-subtitle{font-size:.9rem;color:var(--muted);margin-bottom:1.5rem}

  const container = document.getElementById("mainContainer");

  let DATA = { gdz: [], articles: [], schedule: [], banners: [] };

  /* ============================================================
     FRONTMATTER PARSER (исправленный)
     ============================================================ */
  function parseFrontmatter(text){
    const m = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/);
    if(!m) return {meta:{}, body:text};

    const lines = m[1].split("\n");
    const meta = {};
    let i = 0;

    function unquote(v){
      v = String(v).trim();
      if((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) v = v.slice(1,-1);
      if(v === "true") return true;
      if(v === "false") return false;
      if(v === "null" || v === "~") return null;
      return v;
    }

    // Читает блочный скаляр (| или >), начиная со строки startIdx (которая содержит "|")
    // Возвращает строку и устанавливает i на первую строку ПОСЛЕ блока.
    function readBlockScalar(startIdx){
      const blockLines = [];
      let j = startIdx + 1;
      let indent = null;
      let started = false;

      while(j < lines.length){
        const line = lines[j];
        const trimmed = line.replace(/\s+$/,"");

        if(trimmed === ""){
          if(started) blockLines.push("");
          j++;
          continue;
        }

        const cur = line.match(/^(\s*)/)[1].length;

        if(indent === null){
          if(cur === 0) break; // блок не начался
          indent = cur;
        }

        if(cur < indent){
          // закончился блок
          break;
        }

        started = true;
        blockLines.push(line.slice(indent));
        j++;
      }

      // убираем пустые строки в конце
      while(blockLines.length && blockLines[blockLines.length-1] === "") blockLines.pop();

      i = j; // ВАЖНО: сдвигаем указатель
      return blockLines.join("\n");
    }

    while(i < lines.length){
      const line = lines[i];
      if(!line.trim()){ i++; continue; }
      if(/^\s/.test(line)){ i++; continue; } // вложенные строки обрабатываются отдельно
      const idx = line.indexOf(":");
      if(idx === -1){ i++; continue; }

      const key = line.slice(0, idx).trim();
      let val = line.slice(idx + 1).trim();

      // блочный скаляр как значение верхнего уровня
      if(val === "|" || val === ">" || val === "|-" || val === ">-" || val === "|+" || val === ">+"){
        meta[key] = readBlockScalar(i);
        continue;
      }

      // пустое значение — возможно, вложенный объект или массив
      if(val === ""){
        i++;
        const items = [];
        let isArray = false;
        let obj = null;
        const dashIndentRef = {v: null};

        while(i < lines.length){
          const cur = lines[i];
          if(cur.trim() === ""){ i++; continue; }
          const curIndent = cur.match(/^(\s*)/)[1].length;
          if(curIndent === 0) break; // вернулись на верхний уровень

          if(/^\s*-\s/.test(cur)){
            // элемент массива
            if(!isArray){
              isArray = true;
            }
            const dashIndent = cur.match(/^(\s*)-/)[1].length;
            dashIndentRef.v = dashIndent;
            const itemContent = cur.replace(/^\s*-\s*/, "").trim();

            if(itemContent === ""){
              // элемент-объект, поля идут ниже
              obj = {};
              i++;
              // читаем поля объекта
              while(i < lines.length){
                const nxt = lines[i];
                if(nxt.trim() === ""){ i++; continue; }
                const nxtIndent = nxt.match(/^(\s*)/)[1].length;
                if(nxtIndent <= dashIndent) break;
                if(/^\s*-\s/.test(nxt)) break;
                const kIdx = nxt.indexOf(":");
                if(kIdx === -1){ i++; continue; }
                const k = nxt.slice(0, kIdx).trim();
                const v = nxt.slice(kIdx + 1).trim();
                if(v === "|" || v === ">" || v === "|-" || v === ">-" || v === "|+" || v === ">+"){
                  obj[k] = readBlockScalar(i);
                } else {
                  obj[k] = unquote(v);
                  i++;
                }
              }
              items.push(obj);
              continue;
            }

            // элемент может быть "key: value" или просто значением
            const itemIdx = itemContent.indexOf(":");
            if(itemIdx === -1){
              items.push(unquote(itemContent));
              i++;
            } else {
              obj = {};
              const firstKey = itemContent.slice(0, itemIdx).trim();
              const firstVal = itemContent.slice(itemIdx + 1).trim();
              if(firstVal === "|" || firstVal === ">" || firstVal === "|-" || firstVal === ">-" || firstVal === "|+" || firstVal === ">+"){
                obj[firstKey] = readBlockScalar(i);
              } else {
                obj[firstKey] = unquote(firstVal);
                i++;
              }
              // остальные поля объекта
              while(i < lines.length){
                const nxt = lines[i];
                if(nxt.trim() === ""){ i++; continue; }
                const nxtIndent = nxt.match(/^(\s*)/)[1].length;
                if(nxtIndent <= dashIndent) break;
                if(/^\s*-\s/.test(nxt)) break;
                const kIdx = nxt.indexOf(":");
                if(kIdx === -1){ i++; continue; }
                const k = nxt.slice(0, kIdx).trim();
                const v = nxt.slice(kIdx + 1).trim();
                if(v === "|" || v === ">" || v === "|-" || v === ">-" || v === "|+" || v === ">+"){
                  obj[k] = readBlockScalar(i);
                } else {
                  obj[k] = unquote(v);
                  i++;
                }
              }
              items.push(obj);
            }
            continue;
          }

          // не массив — вложенный объект
          if(!isArray){
            if(obj === null) obj = {};
            const kIdx = cur.indexOf(":");
            if(kIdx === -1){ i++; continue; }
            const k = cur.slice(0, kIdx).trim();
            const v = cur.slice(kIdx + 1).trim();
            if(v === "|" || v === ">" || v === "|-" || v === ">-" || v === "|+" || v === ">+"){
              obj[k] = readBlockScalar(i);
            } else {
              obj[k] = unquote(v);
              i++;
            }
            continue;
          }

          i++;
        }

        meta[key] = isArray ? items : (obj || items);
        continue;
      }

      meta[key] = unquote(val);
      i++;
    }

    return {meta, body: m[2]};
  }

  /* MARKDOWN */
  if(window.marked){
    marked.setOptions({ gfm: true, breaks: true, headerIds: false, mangle: false });
  }
  function mdToHtml(md){
    if(!md) return "";
    let src = String(md).trim();
    // защита от случайного литерала "|-" или "|"
    if(src === "|" || src === "|-" || src === ">") src = "";
    if(!window.marked){
      return "<p>" + src.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>") + "</p>";
    }
    let html = marked.parse(src);
    html = html
      .replace(/<script[\s\S]*?<\/script>/gi, "")
      .replace(/\son\w+\s*=\s*"[^"]*"/gi, "")
      .replace(/\son\w+\s*=\s*'[^']*'/gi, "")
      .replace(/\son\w+\s*=\s*[^\s>]+/gi, "")
      .replace(/href\s*=\s*"javascript:[^"]*"/gi, 'href="#"')
      .replace(/href\s*=\s*'javascript:[^']*'/gi, "href='#'");
    return html;
  }

  function fmtDate(iso){ if(!iso) return ""; const [y,m,d] = String(iso).split("-"); return d + "." + m + "." + y; }
  function todayIso(){ const t = new Date(); return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function subjectSlug(name){ return SUBJECT_SLUGS[name] || name.toLowerCase().replace(/\s+/g,"-"); }

  /* LOAD */
  async function fetchDir(path){
    const r = await fetch(API + path + "?ref=" + BRANCH);
    if(!r.ok) return [];
    const items = await r.json();
    return items.filter(i=>i.type === "file" && i.name.endsWith(".md"));
  }
  async function fetchFile(path){
    const r = await fetch(RAW + path);
    if(!r.ok) return null;
    return await r.text();

  async function loadAll(){
    const [gdzFiles, artFiles, schFiles, banFiles] = await Promise.all([
      fetchDir("gdz").catch(()=>[]),
      fetchDir("articles").catch(()=>[]),
      fetchDir("schedule").catch(()=>[]),
      fetchDir("banners").catch(()=>[])
    ]);

    const gdz = [];
    for(const f of gdzFiles){
      const txt = await fetchFile("gdz/" + f.name);
      if(!txt) continue;
      const {meta, body} = parseFrontmatter(txt);
      let tasks = [];
      if(Array.isArray(meta.tasks) && meta.tasks.length){
        tasks = meta.tasks.map(t=>{
          let bodyVal = t.solution != null ? t.solution : (t.body != null ? t.body : "");
          bodyVal = String(bodyVal).trim();
          // защита от "|-" оставшегося в значении
          if(bodyVal === "|" || bodyVal === "|-" || bodyVal === ">" || bodyVal === ">-") bodyVal = "";
          return {
            task: String(t.number != null ? t.number : (t.task != null ? t.task : "")).trim(),
            body: bodyVal
          };
        }).filter(t=>t.task || t.body);
      }
      if(!tasks.length && (meta.task || body.trim())){
        let bodyVal = body.trim();
        if(bodyVal === "|" || bodyVal === "|-") bodyVal = "";
        tasks = [{ task: String(meta.task || "").trim(), body: bodyVal }];
      }
      gdz.push({
        file: f.name,
        class: meta.class || "7",
        subject: meta.subject || "—",
        date: meta.date || "",
        tasks
      });
    }

    const articles = [];
    for(const f of artFiles){
      const txt = await fetchFile("articles/" + f.name);
      if(!txt) continue;
      const {meta, body} = parseFrontmatter(txt);
      const slug = (meta.slug || f.name.replace(/\.md$/,"")).toString().trim();
      articles.push({
        file: f.name,
        title: meta.title || slug,
        hidden: meta.hidden === true,
        slug, body: body.trim()
      });
    }

    const schedule = [];
    for(const f of schFiles){
      const txt = await fetchFile("schedule/" + f.name);
      if(!txt) continue;
      const {meta} = parseFrontmatter(txt);
      schedule.push({
        file: f.name,
        date: meta.date || "",
        day: meta.day || "",
        lessons: Array.isArray(meta.lessons) ? meta.lessons : []
      });
    }

    const banners = [];
    for(const f of banFiles){
      const txt = await fetchFile("banners/" + f.name);
      if(!txt) continue;
      const {meta} = parseFrontmatter(txt);
      if(meta.active === false) continue;
      banners.push({
        file: f.name,
        title: meta.title || "",
        text: meta.text || "",
        icon: meta.icon || "✨",
        button_text: meta.button_text || "",
        button_url: meta.button_url || "",
        date: meta.date || ""
      });
    }
    banners.sort((a,b)=>(b.date || "").localeCompare(a.date || ""));

    DATA = { gdz, articles, schedule, banners, loaded: Date.now() };
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(DATA)); }catch(e){}
    return DATA;
  }

  async function getData(){
    try{
      const cached = localStorage.getItem(CACHE_KEY);
      if(cached){
        const parsed = JSON.parse(cached);
        if(parsed.loaded && Date.now() - parsed.loaded < CACHE_TTL){
          DATA = parsed;
          if(!Array.isArray(DATA.banners)) DATA.banners = [];
          if(!Array.isArray(DATA.schedule)) DATA.schedule = [];
          if(!Array.isArray(DATA.gdz)) DATA.gdz = [];
          if(!Array.isArray(DATA.articles)) DATA.articles = [];
          return DATA;
        }
      }
    }catch(e){}
    return await loadAll();
  }

  /* DATA UTILS */
  function flatTasks(){
    const out = [];
    DATA.gdz.forEach(g=>{
      (g.tasks || []).forEach((t, idx)=>{
        out.push({ file:g.file, class:g.class, subject:g.subject, date:g.date, task:t.task, body:t.body, idx });
      });
    });
    return out;
  }
  function gdzTasksBySubject(subj){ return flatTasks().filter(t=>t.subject === subj); }
  function gdzTasksBySubjectDate(subj, date){ return flatTasks().filter(t=>t.subject === subj && t.date === date); }
  function datesForSubject(subj){
    const set = new Set();
    gdzTasksBySubject(subj).forEach(t=>{ if(t.date) set.add(t.date); });
    return [...set].sort((a,b)=>b.localeCompare(a));
  }
  function gdzDatesFor(subject){ return [...new Set(flatTasks().filter(t=>t.subject === subject).map(t=>t.date))].sort(); }
  function resolveGdzLink(subject, date){
    const s = subjectSlug(subject);
    const dates = gdzDatesFor(subject);
    if(dates.includes(date)) return "#page/gdz/" + s + "/" + date;
    const past = dates.filter(d=>d < date).sort().reverse();
    if(past.length) return "#page/gdz/" + s + "/" + past[0];
    const future = dates.filter(d=>d > date).sort();
    if(future.length) return "#page/gdz/" + s + "/" + future[0];
    return "#page/subject/" + s;
  }

  /* BANNER */
  function buildBannerHtml(){
    const list = (DATA.banners || []).filter(b=>b.title || b.text);
    if(!list.length) return "";
    const visible = list.filter(b=>{
      try{
        const key = "zadano:banner-dismissed:" + (b.file || b.title);
        return localStorage.getItem(key) !== "1";
      }catch(e){ return true; }
    });
    if(!visible.length) return "";

    const slides = visible.map((b, i)=>{
      const icon = b.icon || "✨";
      const titleHtml = b.title ? '<div class="banner-title">' + esc(b.title) + '</div>' : '';
      const textHtml = b.text ? '<div class="banner-text">' + esc(b.text).replace(/\n/g, '<br>') + '</div>' : '';
      const toggleHtml = (b.text && b.text.length > 180) ? '<button class="banner-toggle" type="button" data-toggle="1">Развернуть</button>' : '';
      const btnHtml = (b.button_text && b.button_url)
        ? '<div class="banner-actions"><a class="banner-btn" data-ga="banner_click" href="' + esc(b.button_url) + '" target="' + (b.button_url.startsWith("#") ? "_self" : "_blank") + '" rel="noopener">' + esc(b.button_text) + '</a></div>'
        : '';
      return '<div class="banner-slide' + (i === 0 ? ' active' : '') + '" data-file="' + esc(b.file || "") + '" data-index="' + i + '">' +
        '<button class="banner-close" aria-label="Закрыть" data-dismiss="1">✕</button>' +
        '<div class="banner-inner">' +
          '<div class="banner-icon">' + esc(icon) + '</div>' +
          '<div class="banner-body">' + titleHtml + textHtml + toggleHtml + btnHtml + '</div>' +
        '</div>' +
      '</div>';
    }).join("");

    const dots = visible.map((_, i)=>
      '<button class="banner-dot' + (i === 0 ? ' active' : '') + '" data-slide="' + i + '" aria-label="Баннер ' + (i+1) + '"></button>'
    ).join("");

    const navHtml = visible.length > 1
      ? '<div class="banner-nav">' +
          '<span class="banner-counter" id="bannerCounter">1 / ' + visible.length + '</span>' +
          '<div class="banner-dots" id="bannerDots">' + dots + '</div>' +
          '<div class="banner-arrows">' +
            '<button class="banner-arrow" id="bannerPrev" aria-label="Назад">←</button>' +
            '<button class="banner-arrow" id="bannerNext" aria-label="Вперёд">→</button>' +
          '</div>' +
        '</div>'
      : '';

    return '<section class="banner banner-carousel" data-total="' + visible.length + '">' + slides + navHtml + '</section>';
  }

  function bindBanner(){
    const el = container.querySelector(".banner");
    if(!el) return;
    const slides = el.querySelectorAll(".banner-slide");
    const dots = el.querySelectorAll(".banner-dot");
    const counter = el.querySelector("#bannerCounter");
    const prevBtn = el.querySelector("#bannerPrev");
    const nextBtn = el.querySelector("#bannerNext");
    let current = 0;

    function show(idx){
      if(idx < 0) idx = slides.length - 1;
      if(idx >= slides.length) idx = 0;
      slides.forEach((s, i)=> s.classList.toggle("active", i === idx));
      dots.forEach((d, i)=> d.classList.toggle("active", i === idx));
      if(counter) counter.textContent = (idx + 1) + " / " + slides.length;
      current = idx;
    }

    if(prevBtn) prevBtn.addEventListener("click", ()=>show(current - 1));
    if(nextBtn) nextBtn.addEventListener("click", ()=>show(current + 1));
    dots.forEach((d, i)=> d.addEventListener("click", ()=>show(i)));

    el.querySelectorAll(".banner-close").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const slide = btn.closest(".banner-slide");
        const file = slide.dataset.file || "";
        try{ localStorage.setItem("zadano:banner-dismissed:" + file, "1"); }catch(e){}
        if(window.gtag) gtag('event', 'banner_dismiss', { banner: file });
        slide.style.transition = "opacity .25s";
        slide.style.opacity = "0";
        setTimeout(()=>{
          slide.remove();
          const remaining = el.querySelectorAll(".banner-slide");
          if(remaining.length === 0){ el.remove(); }
          else {
            show(0);
            if(counter) counter.textContent = "1 / " + remaining.length;
            if(remaining.length === 1){
              const nav = el.querySelector(".banner-nav");
              if(nav) nav.remove();
            }
          }
        }, 250);
      });
    });

    el.querySelectorAll(".banner-toggle").forEach(toggle=>{
      toggle.addEventListener("click", ()=>{
        const slide = toggle.closest(".banner-slide");
        const expanded = slide.classList.toggle("expanded");
        toggle.textContent = expanded ? "Свернуть" : "Развернуть";
      });
    });

    el.querySelectorAll("[data-ga]").forEach(a=>{
      a.addEventListener("click", ()=>{
        if(window.gtag){
          gtag('event', a.dataset.ga, {
            banner: a.closest(".banner-slide")?.dataset.file || "",
            url: a.getAttribute("href") || ""
          });
        }
      });
    });
  }

    const articlesHtml = visibleArticles.map(a=>
      '<a class="article-item" href="#article/' + esc(a.slug) + '">' +
        '<span class="info"><span class="name">' + esc(a.title) + '</span>' +
        '<span class="meta">статья</span></span>' +
        '<span class="arrow">→</span>' +
      '</a>'
    ).join("");

    container.innerHTML =
      buildBannerHtml() +
      scheduleHtml +
      '<main class="bento">' +
        '<section class="tile latest">' +
          '<div class="section-head"><span class="section-title">Свежее</span></div>' +
          '<div class="latest-list">' +
            (latestHtml || '<div class="latest-item"><span class="info"><span class="name">Пока нет решений</span></span></div>') +
          '</div>' +
        '</section>' +
        '<section class="tile subjects">' +
          '<div class="subjects-head">' +
            '<span class="subjects-title">Предметы</span>' +
            '<span class="subjects-count">' + SUBJECTS.length + '</span>' +
          '</div>' +
          '<div class="subjects-grid">' + subjectsHtml + '</div>' +
        '</section>' +
        '<section class="tile articles">' +
          '<div class="section-head"><span class="section-title">Статьи</span></div>' +
          '<div class="articles-list">' +
            (articlesHtml || '<div class="article-item"><span class="info"><span class="name">Статей пока нет</span></span></div>') +
          '</div>' +
        '</section>' +
        '<section class="tile feedback clickable" id="feedbackTile">' +
          '<div class="feedback-icon">🐞</div>' +
          '<div class="feedback-text">' +
            '<div class="feedback-title">Нашли ошибку?</div>' +
            '<div class="feedback-sub">Напишите — исправим</div>' +
          '</div>' +
          '<span class="feedback-badge">Telegram</span>' +
        '</section>' +
        '<section class="tile about clickable" id="aboutTile">' +
          '<div class="about-text">' +
            '<div class="about-title">О сайте</div>' +
            '<div class="about-sub">Zadano — ГДЗ-помощник для 7 класса.</div>' +
          '</div>' +
          '<span class="about-arrow">→</span>' +
        '</section>' +
      '</main>';

    document.getElementById("aboutTile").addEventListener("click", ()=>navigate("page/about"));
    document.getElementById("feedbackTile").addEventListener("click", ()=>{
      if(window.gtag) gtag('event', 'feedback_click', { location: 'home_tile' });
      alert("Напишите нам в Telegram: @zadano_feedback");
    });

    bindSchedule();
    bindBanner();
  }

  function buildScheduleHtml(entry, currentDate, ALL_DATES, currentIdx){
    const today = todayIso();
    const modeLabel = currentDate === today ? "Сегодня" : "Завтра";
    const cur = getCurrentLessonIdx(entry.lessons, currentDate);

    const lessonsHtml = entry.lessons.map((l, i)=>{
      const hasGdz = gdzDatesFor(l.subject).includes(currentDate);
      const href = resolveGdzLink(l.subject, currentDate);
      const isCur = i === cur;
      const dates = gdzDatesFor(l.subject);
      const lastDate = dates.filter(d=>d <= currentDate).sort().reverse()[0] || dates.sort()[0];
      const hint = hasGdz ? "есть ГДЗ" : (lastDate ? "→ " + fmtDate(lastDate) : "");

      return '<a class="lesson-card' + (hasGdz ? " has-gdz" : "") + (isCur ? " current" : "") + '" href="' + href + '">' +
        '<span class="time">' + esc(l.time || "") + '</span>' +
        '<span class="name">' + esc(l.subject || "") + '</span>' +
        '<span class="room">' + esc(l.room || "—") + '</span>' +
        (hint ? '<span class="gdz-hint">' + esc(hint) + '</span>' : '') +
      '</a>';
    }).join("");

    let done = 0;
    if(cur >= 0) done = cur + 1;
    else {
      const now = new Date();
      const mins = now.getHours()*60 + now.getMinutes();
      entry.lessons.forEach(l=>{
        if(!l.time) return;
        const [h,m] = l.time.split(":").map(Number);
        if(h*60+m+45 < mins) done++;
      });
      if(currentDate !== today) done = 0;
    }
    const progressPct = entry.lessons.length ? (done/entry.lessons.length)*100 : 0;

    return '<section class="schedule-bar" data-idx="' + currentIdx + '" data-dates="' + ALL_DATES.join(",") + '">' +
      '<div class="schedule-head">' +
        '<div class="schedule-title">' +
          '<span class="dot"></span>' +
          '<span id="schLabel">' + modeLabel + ' · ' + fmtDate(currentDate) + '</span>' +
          '<span class="day-name" id="schDay">' + esc(entry.day || "") + '</span>' +
        '</div>' +
        '<div class="schedule-tabs" id="schTabs">' +
          '<button class="schedule-tab active" data-day="today">сегодня</button>' +
          '<button class="schedule-tab" data-day="tomorrow">завтра</button>' +
        '</div>' +
        '<div class="schedule-arrows">' +
          '<button class="schedule-arrow" id="schPrev" ' + (currentIdx === 0 ? "disabled" : "") + ' aria-label="Назад">←</button>' +
          '<button class="schedule-arrow" id="schNext" ' + (currentIdx === ALL_DATES.length - 1 ? "disabled" : "") + ' aria-label="Вперёд">→</button>' +
        '</div>' +
      '</div>' +
      '<div class="day-progress">' +
        '<span id="progressText">' + done + ' из ' + entry.lessons.length + ' уроков</span>' +
        '<div class="day-progress-bar"><div class="day-progress-fill" id="progressFill" style="width:' + progressPct + '%"></div></div>' +
      '</div>' +
      '<div class="lessons-strip" id="lessonsStrip">' + lessonsHtml + '</div>' +
    '</section>';
  }

  function bindSchedule(){
    const bar = container.querySelector(".schedule-bar");
    if(!bar) return;
    const ALL_DATES = (bar.dataset.dates || "").split(",").filter(Boolean);
    let idx = parseInt(bar.dataset.idx || "0", 10);

    const prevBtn = document.getElementById("schPrev");
    const nextBtn = document.getElementById("schNext");
    const tabs = document.getElementById("schTabs");

    function rerender(newIdx){
      idx = Math.max(0, Math.min(ALL_DATES.length - 1, newIdx));
      const date = ALL_DATES[idx];
      const entry = DATA.schedule.find(s=>s.date === date);
      if(!entry) return;

      const today = todayIso();
      const modeLabel = date === today ? "Сегодня" : "Завтра";
      const cur = getCurrentLessonIdx(entry.lessons, date);

      document.getElementById("schLabel").textContent = modeLabel + " · " + fmtDate(date);
      document.getElementById("schDay").textContent = entry.day || "";

      const strip = document.getElementById("lessonsStrip");
      strip.innerHTML = entry.lessons.map((l, i)=>{
        const hasGdz = gdzDatesFor(l.subject).includes(date);
        const href = resolveGdzLink(l.subject, date);
        const isCur = i === cur;
        const dates = gdzDatesFor(l.subject);
        const lastDate = dates.filter(d=>d <= date).sort().reverse()[0] || dates.sort()[0];
        const hint = hasGdz ? "есть ГДЗ" : (lastDate ? "→ " + fmtDate(lastDate) : "");
        return '<a class="lesson-card' + (hasGdz ? " has-gdz" : "") + (isCur ? " current" : "") + '" href="' + href + '">' +
          '<span class="time">' + esc(l.time || "") + '</span>' +
          '<span class="name">' + esc(l.subject || "") + '</span>' +
          '<span class="room">' + esc(l.room || "—") + '</span>' +
          (hint ? '<span class="gdz-hint">' + esc(hint) + '</span>' : '') +
        '</a>';
      }).join("");

      let done = 0;
      if(cur >= 0) done = cur + 1;
      else {
        const now = new Date();
        const mins = now.getHours()*60 + now.getMinutes();
        entry.lessons.forEach(l=>{
          if(!l.time) return;
          const [h,m] = l.time.split(":").map(Number);
          if(h*60+m+45 < mins) done++;
        });
        if(date !== today) done = 0;
      }
      document.getElementById("progressText").textContent = done + " из " + entry.lessons.length + " уроков";
      document.getElementById("progressFill").style.width = (entry.lessons.length ? (done/entry.lessons.length)*100 : 0) + "%";

      prevBtn.disabled = idx === 0;
      nextBtn.disabled = idx === ALL_DATES.length - 1;
      strip.scrollLeft = 0;
    }

    prevBtn.addEventListener("click", ()=>rerender(idx - 1));
    nextBtn.addEventListener("click", ()=>rerender(idx + 1));

    tabs.querySelectorAll(".schedule-tab").forEach(tab=>{
      tab.addEventListener("click", ()=>{
        const target = tab.dataset.day === "today" ? todayIso() : (()=>{
          const t = new Date(); t.setDate(t.getDate()+1);
          return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
        })();
        const ti = ALL_DATES.indexOf(target);
        if(ti !== -1){
          tabs.querySelectorAll(".schedule-tab").forEach(x=>x.classList.toggle("active", x === tab));
          rerender(ti);
        }
      });
    });
  }

  function getCurrentLessonIdx(lessons, date){
    if(date !== todayIso()) return -1;
    const now = new Date();
    const mins = now.getHours()*60 + now.getMinutes();
    for(let i=0; i<lessons.length; i++){
      if(!lessons[i].time) continue;
      const [h,m] = lessons[i].time.split(":").map(Number);
      const s = h*60+m, e = s+45;
      if(mins >= s && mins < e) return i;
    }
    return -1;
  }

  /* SUBJECT */
  function renderSubject(slug){
    const subj = SUBJECTS.find(s=>subjectSlug(s) === slug);
    if(!subj) return renderHome();
    const dates = datesForSubject(subj);
    let html = '<div class="inner">' +
      '<a class="back-btn" href="#page/home">← назад</a>' +
      '<h1 class="page-title">' + esc(subj) + '</h1>' +
      '<p class="page-subtitle">' + gdzTasksBySubject(subj).length + ' решений</p>';
    if(!dates.length){
      html += '<div class="empty-state visible"><span class="icon">📭</span>Пока решений нет. Скоро появятся.</div>';
    } else {
      html += '<div class="date-list">';
      dates.forEach(d=>{
        const items = gdzTasksBySubjectDate(subj, d);
        html += '<a class="date-item" href="#page/gdz/' + subjectSlug(subj) + '/' + d + '">' +
          '<span>' + esc(fmtDate(d)) + '</span>' +
          '<span class="count">' + items.length + '</span></a>';
      });
      html += '</div>';
    }
    html += '</div>';
    container.innerHTML = '<section class="page active">' + html + '</section>';
    window.scrollTo({top:0, behavior:'instant'});
  }

  /* GDZ */
  function renderGdzPage(rest){
    const parts = rest.split("/");
    const slug = parts[0];
    const date = parts[1];
    const subj = SUBJECTS.find(s=>subjectSlug(s) === slug);
    if(!subj) return renderHome();
    const items = gdzTasksBySubjectDate(subj, date);
    const backHref = "#page/subject/" + slug;
    let html = '<div class="inner">' +
      '<a class="back-btn" href="' + backHref + '">← назад</a>' +
      '<h1 class="page-title">' + esc(fmtDate(date)) + '</h1>' +
      '<p class="page-subtitle">' + esc(subj) + '</p>';
    if(!items.length){
      html += '<div class="empty-state visible"><span class="icon">📭</span>Нет решений на эту дату.</div>';
    } else {
      items.forEach((item)=>{
        const key = slug + "-" + date + "-" + item.task;
        const bodyHtml = item.body ? mdToHtml(item.body) : '<p style="color:var(--muted)">Решение пока не добавлено.</p>';
        html += '<div class="solution-block">' +
          '<div class="task-title">' + esc(item.task) + '</div>' +
          '<div class="task-desc">' + bodyHtml + '</div>' +
          ratingWidget(key, { subject: subj, date: fmtDate(item.date), task: "№" + item.task }) +
          '<div class="error-report">Нашли ошибку? ' +
            '<a href="#" data-feedback data-subject="' + esc(subj) + '" ' +
              'data-date="' + esc(fmtDate(item.date)) + '" ' +
              'data-task="№' + esc(item.task) + '">Сообщите об этом.</a>' +
          '</div>' +
        '</div>';
      });
    }
    html += '</div>';
    container.innerHTML = '<section class="page active">' + html + '</section>';
    window.scrollTo({top:0, behavior:'instant'});
  }

  /* ARTICLE */
  function renderArticle(slug){
    const art = DATA.articles.find(a=>a.slug === slug);
    if(!art){
      container.innerHTML = '<section class="page active"><div class="inner"><a class="back-btn" href="#page/home">← назад</a><h1 class="page-title">Статья не найдена</h1></div></section>';
      return;
    }
    container.innerHTML =
      '<section class="page active"><div class="inner">' +
        '<a class="back-btn" href="#page/home">← назад</a>' +
        '<h1 class="page-title">' + esc(art.title) + '</h1>' +
        '<div class="article-body">' + mdToHtml(art.body) + '</div>' +
      '</div></section>';
    window.scrollTo({top:0, behavior:'instant'});
  }

  /* ABOUT */
  function renderAbout(){
    container.innerHTML =
      '<section class="page active"><div class="inner">' +
        '<a class="back-btn" href="#page/home">← назад</a>' +
        '<h1 class="page-title">О сайте</h1>' +
        '<p class="page-subtitle">Коротко</p>' +
        '<div class="article-body"><p>Zadano — минималистичный ГДЗ-помощник для 7 класса. Выбирай предмет — смотри решения. Все материалы предоставлены для самопроверки.</p><p>Нашли ошибку — сообщите, исправим.</p></div>' +
      '</div></section>';
    window.scrollTo({top:0, behavior:'instant'});
  }

  /* MENU */
  function buildMenu(){
    const visibleArticles = DATA.articles.filter(a=>!a.hidden);
    const chevSvg = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';

    const subjectsSub = SUBJECTS.map(s=>
      '<button class="menu-sublink" data-nav="page/subject/' + subjectSlug(s) + '">' + esc(s.toLowerCase()) + '</button>'
    ).join("");

    const articlesSub = visibleArticles.length
      ? visibleArticles.map(a=>
          '<button class="menu-sublink" data-nav="article/' + esc(a.slug) + '">' + esc(a.title) + '</button>'
        ).join("")
      : '<div class="menu-sublink" style="cursor:default;opacity:.6">пока пусто</div>';

    let html = '';
    html += '<a class="menu-link" data-nav="page/home">главная</a>';
    html += '<button class="menu-toggle" data-target="sub-subjects" aria-expanded="false"><span class="label">предметы</span>' + chevSvg + '</button>';
    html += '<div class="menu-sub" id="sub-subjects"><div class="menu-sub-grid">' + subjectsSub + '</div></div>';
    html += '<button class="menu-toggle" data-target="sub-articles" aria-expanded="false"><span class="label">статьи</span>' + chevSvg + '</button>';
    html += '<div class="menu-sub" id="sub-articles">' + articlesSub + '</div>';
    html += '<a class="menu-link" data-nav="page/about">о сайте</a>';
    menuNav.innerHTML = html;

    menuNav.querySelectorAll(".menu-toggle").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const targetId = btn.dataset.target;
        const sub = document.getElementById(targetId);
        if(!sub) return;
        const isOpen = sub.classList.contains("open");
        menuNav.querySelectorAll(".menu-sub.open").forEach(s=>{ if(s !== sub) s.classList.remove("open"); });
        menuNav.querySelectorAll(".menu-toggle").forEach(b=>{ if(b !== btn) b.setAttribute("aria-expanded", "false"); });
        sub.classList.toggle("open", !isOpen);
        btn.setAttribute("aria-expanded", String(!isOpen));
      });
    });

    menuNav.querySelectorAll("[data-nav]").forEach(el=>{
      el.addEventListener("click", e=>{
        e.preventDefault();
        navigate(el.dataset.nav);
        closeMenu();
      });
    });
  }

  function openMenu(){ menu.classList.add("active"); document.body.classList.add("no-scroll"); }
  function closeMenu(){ menu.classList.remove("active"); document.body.classList.remove("no-scroll"); }
  document.getElementById("openMenuBtn").addEventListener("click", openMenu);
  document.getElementById("closeMenuBtn").addEventListener("click", closeMenu);
  menu.addEventListener("click", e=>{
    if(!e.target.closest(".menu-link") && !e.target.closest(".menu-toggle") && !e.target.closest(".menu-sub") && !e.target.closest(".close-menu")) closeMenu();
  });
  document.addEventListener("keydown", e=>{
    if(e.key === "Escape" && menu.classList.contains("active")) closeMenu();
  });

  /* SEARCH */
  function performSearch(q){
    q = q.trim().toLowerCase();
    searchClear.classList.toggle("visible", q.length > 0);
    if(!q){ searchResults.classList.remove("visible"); searchResults.innerHTML = ""; return; }
    const results = [];
    flatTasks().forEach(t=>{
      const hay = (t.subject + " " + t.task + " " + t.body).toLowerCase();
      if(!hay.includes(q)) return;
      results.push({ type:"ГДЗ", title:t.subject + " · №" + t.task, sub:fmtDate(t.date), href:"#page/gdz/" + subjectSlug(t.subject) + "/" + t.date });
    });
    DATA.articles.forEach(a=>{
      const hay = (a.title + " " + a.body).toLowerCase();
      if(hay.includes(q)){
        results.push({ type:"Статья", title:a.title, sub:a.hidden ? "скрытая" : "", href:"#article/" + a.slug });
      }
    });
    if(!results.length){
      searchResults.innerHTML = '<div class="search-no visible">Ничего не найдено</div>';
    } else {
      searchResults.innerHTML = results.slice(0,20).map(r=>
        '<div class="search-result" data-href="' + esc(r.href) + '">' +
          '<div class="sr-type">' + esc(r.type) + '</div>' +
          '<div class="sr-title">' + esc(r.title) + '</div>' +
          (r.sub ? '<div class="sr-sub">' + esc(r.sub) + '</div>' : '') +
        '</div>'
      ).join("");
    }
    searchResults.classList.add("visible");
    searchResults.querySelectorAll(".search-result").forEach(el=>{
      el.addEventListener("click", ()=>{
        if(window.gtag) gtag('event', 'search_select', { query: q, target: el.dataset.href });
        searchResults.classList.remove("visible");
        searchInput.value = "";
        searchClear.classList.remove("visible");
        navigate(el.dataset.href.slice(1));
      });
    });
  }

  searchInput.addEventListener("input", e=>performSearch(e.target.value));
  searchClear.addEventListener("click", ()=>{ searchInput.value=""; performSearch(""); searchInput.focus(); });
  searchInput.addEventListener("keydown", e=>{ if(e.key === "Escape"){ searchInput.value=""; performSearch(""); searchInput.blur(); }});
  document.addEventListener("click", e=>{ if(!e.target.closest(".search")) searchResults.classList.remove("visible"); });

  /* START */
  async function init(){
    await getData();
    buildMenu();
    render(location.hash.slice(1) || "page/home");
  }
  init();
})();
</script>
