collections:
  - name: "gdz"
    label: "ГДЗ"
    folder: "gdz"
    create: true
    slug: "{{date}}-{{subject}}-{{task}}"  # Имя файла будет: 2026-09-26-алгебра-234.md
    fields:
      - { label: "Класс", name: "class", widget: "string", default: "7" }
      - { label: "Предмет", name: "subject", widget: "select", options: ["Алгебра", "Геометрия", "Русский язык", "Английский язык", "Биология", "История", "Физика", "Информатика"] }
      - { label: "Дата", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false }
      - { label: "Номер задания", name: "task", widget: "string" }
      - { label: "Решение", name: "body", widget: "markdown" }
