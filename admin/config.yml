backend:
  name: github
  repo: zadano/zadano.github.io
  branch: main
  base_url: https://sveltia-cms-auth.n7ycgcn5jd.workers.dev

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  # ==========================================
  # ГДЗ
  # ==========================================
  - name: "gdz"
    label: "ГДЗ"
    folder: "gdz"
    create: true
    slug: "{{class}}-{{subject}}-{{date}}-{{task}}"
    fields:
      - label: "Класс"
        name: "class"
        widget: "select"
        options: ["7"]

      - label: "Предмет"
        name: "subject"
        widget: "select"
        options:
          - "Литература"
          - "Алгебра"
          - "Геометрия"
          - "Вероятность и статистика"
          - "Информатика"
          - "История"
          - "Обществознание"
          - "География"
          - "Биология"
          - "Физика"
          - "Химия"
          - "Иностранный язык"
          - "Основы безопасности жизнедеятельности"
          - "Физическая культура"
          - "Искусство"
          - "Технология"

      - label: "Дата"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"

      - { label: "Номер задания", name: "task", widget: "string" }
      - { label: "Решение", name: "body", widget: "markdown" }

  # ==========================================
  # РАСПИСАНИЕ
  # ==========================================
  - name: "schedule"
    label: "Расписание"
    folder: "schedule"
    create: true
    slug: "{{date}}"
    fields:
      - label: "Дата"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"

      - { label: "День недели", name: "day", widget: "string", required: false }

      - label: "Уроки"
        name: "lessons"
        widget: "list"
        fields:
          - { label: "Время", name: "time", widget: "string" }
          - { label: "Предмет", name: "subject", widget: "string" }
          - { label: "Кабинет", name: "room", widget: "string", required: false }

  # ==========================================
  # СТАТЬИ
  # ==========================================
  - name: "articles"
    label: "Статьи"
    folder: "articles"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Slug (URL)", name: "slug", widget: "string", required: false }
      - { label: "Скрытая", name: "hidden", widget: "boolean", default: false, required: false }
      - { label: "Текст", name: "body", widget: "markdown" }
